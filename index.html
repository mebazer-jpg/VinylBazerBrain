:root{
  --bg:#0e0c0a;--s1:#151310;--s2:#1c1917;--s3:#242018;
  --bdr:#2e2a25;--bdr2:#3d3830;
  --acc:#d4a853;--acc2:#8b6914;--acc3:#f0c97a;
  --txt:#ede8df;--mut:#7a7068;--mut2:#5a5248;
  --red:#b84040;--grn:#4a8c5c;--blu:#3d6b8c;
  --pri:#c04040;--med:#c08a30;--lo:#4a7a50;
}
body{
  font-family:'DM Mono',monospace;
  background:var(--bg);color:var(--txt);font-size:13px;
  background-image:
    radial-gradient(ellipse at 10% 0%,rgba(212,168,83,.07) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 100%,rgba(139,105,20,.05) 0%,transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* sidebar */
.sidebar{background:var(--s1);border-right:1px solid var(--bdr);padding:24px 0;display:flex;flex-direction:column;gap:0}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--bdr)}
.logo-mark{font-family:'DM Serif Display',serif;font-size:22px;color:var(--acc);line-height:1}
.logo-mark em{font-style:italic;color:var(--acc3)}
.logo-sub{font-size:9px;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-top:4px}
.nav{padding:16px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  transition:all .2s;border-left:2px solid transparent}
.nav-item:hover{color:var(--txt);background:var(--s2)}
.nav-item.on{color:var(--acc);border-left-color:var(--acc);background:var(--s2)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.nav-section{font-size:9px;letter-spacing:2px;color:var(--mut2);text-transform:uppercase;
  padding:14px 20px 6px;margin-top:6px}
.stats-mini{padding:16px 20px;border-top:1px solid var(--bdr);margin-top:auto}
.sm-row{display:flex;justify-content:space-between;padding:3px 0}
.sm-l{color:var(--mut);font-size:10px}
.sm-v{color:var(--acc);font-size:10px;font-weight:500}

/* main */
.main{overflow-y:auto;height:100vh}
.page{padding:28px 32px;max-width:960px}
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--txt)}
.page-title em{font-style:italic;color:var(--acc)}

/* buttons */
.btn{background:none;border:1px solid var(--bdr);border-radius:3px;color:var(--txt);cursor:pointer;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:7px 14px;
  text-transform:uppercase;transition:all .18s;white-space:nowrap}
.btn:hover{border-color:var(--acc2);color:var(--acc)}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#f5e8c8}
.btn.pri:hover{background:var(--acc);border-color:var(--acc);color:#1a1200}
.btn.ghost{border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--txt);border-color:var(--bdr)}
.btn.danger{border-color:#3a1a1a}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* inputs */
input,select,textarea{
  background:var(--s2);border:1px solid var(--bdr);border-radius:3px;
  color:var(--txt);font-family:'DM Mono',monospace;font-size:12px;
  padding:8px 11px;outline:none;transition:border-color .18s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{resize:vertical;min-height:60px}
select option{background:#1c1917}
.field{display:flex;flex-direction:column;gap:5px}
.field label{color:var(--mut);font-size:9px;letter-spacing:2px;text-transform:uppercase}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}

/* table */
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--bdr)}
th{color:var(--mut);font-size:9px;letter-spacing:2px;padding:7px 10px;text-align:left;text-transform:uppercase}
td{padding:10px 10px;border-bottom:1px solid #1e1b17;font-size:12px;vertical-align:middle}
tbody tr:hover td{background:var(--s2)}
.cell-artist{font-weight:500;color:var(--txt)}
.cell-album{color:var(--mut);font-style:italic;font-size:11px;margin-top:2px}
.cell-sub{color:var(--mut2);font-size:10px;margin-top:2px}

/* badges */
.badge{display:inline-block;border:1px solid;border-radius:2px;font-size:9px;letter-spacing:1px;padding:2px 5px;text-transform:uppercase}
.badge-genre{border-color:var(--acc2);color:var(--acc)}
.badge-fmt{border-color:var(--bdr2);color:var(--mut)}
.badge-cond{border-color:var(--bdr2);color:var(--mut)}
.badge-pri-high{border-color:#6a2020;color:var(--pri)}
.badge-pri-med{border-color:#6a4a10;color:var(--med)}
.badge-pri-low{border-color:#2a5030;color:var(--lo)}
.price{color:var(--acc);font-weight:500}

/* cards */
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:5px;padding:18px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* wishlist cards */
.wish-card{background:var(--s1);border:1px solid var(--bdr);border-radius:5px;padding:16px;
  display:flex;flex-direction:column;gap:10px}
.wish-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wish-card-info h4{font-family:'DM Serif Display',serif;font-size:15px;color:var(--txt);margin-bottom:2px}
.wish-card-info p{color:var(--mut);font-size:11px}
.wish-card-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-chip{border:1px solid #4a3800;border-radius:2px;color:#e0a030;font-size:9px;
  letter-spacing:1px;padding:2px 7px;text-transform:uppercase}

/* gap analysis */
.gap-artist-section{margin-bottom:22px}
.gap-artist-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.gap-artist-name{font-family:'DM Serif Display',serif;font-size:17px;color:var(--acc)}
.gap-progress{font-size:10px;color:var(--mut)}
.gap-albums{display:flex;flex-wrap:wrap;gap:6px}
.gap-album{border:1px solid;border-radius:3px;font-size:10px;padding:4px 9px;cursor:default}
.gap-album.owned{border-color:#2a4a30;color:var(--grn);background:rgba(74,140,92,.08)}
.gap-album.missing{border-color:var(--bdr);color:var(--mut)}
.gap-album.missing:hover{border-color:var(--acc2);color:var(--acc)}
.gap-album{display:flex;align-items:center;gap:0}
.gap-album-actions{display:flex;gap:4px;margin-left:6px;opacity:0;transition:opacity .15s}
.gap-album:hover .gap-album-actions{opacity:1}
.gap-btn{border-radius:2px;cursor:pointer;font-size:9px;letter-spacing:.5px;padding:1px 5px;white-space:nowrap;border:1px solid}
.gap-btn-col{border-color:#2a4a2a;color:var(--grn)}
.gap-btn-col:hover{background:rgba(74,140,92,.15)}
.gap-btn-wish{border-color:var(--acc2);color:var(--acc)}
.gap-btn-wish:hover{background:rgba(212,168,83,.1)}

/* bar chart */
.bar-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11px}
.bar-label{width:72px;color:var(--mut);flex-shrink:0;text-align:right}
.bar-track{flex:1;height:5px;background:#1e1b17;border-radius:3px}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .6s}
.bar-count{color:var(--txt);width:22px;text-align:right}

/* upcoming */
.up-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #1e1b17;align-items:flex-start}
.up-date{background:var(--s2);border:1px solid var(--bdr);border-radius:3px;
  text-align:center;padding:6px 10px;min-width:52px;flex-shrink:0}
.up-mo{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.up-day{font-size:20px;color:var(--acc);font-family:'DM Serif Display',serif;line-height:1}
.up-info h4{font-size:13px;color:var(--txt);margin-bottom:3px}
.up-info p{font-size:11px;color:var(--mut)}
.owned-tag{display:inline-block;margin-top:4px;border:1px solid #2c4a2c;
  border-radius:2px;color:var(--grn);font-size:9px;letter-spacing:1px;padding:2px 6px;text-transform:uppercase}


.msg{display:flex;gap:12px;max-width:760px}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{border-radius:4px;padding:12px 15px;font-size:12px;line-height:1.65;max-width:640px}
.msg.assistant .msg-bubble{background:var(--s2);border:1px solid var(--bdr);color:var(--txt)}
.msg.user .msg-bubble{background:var(--acc2);border:1px solid var(--acc);color:#f5e8c8}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:12px;margin-top:2px}
.msg.assistant .msg-avatar{background:var(--s3);border:1px solid var(--bdr);color:var(--acc)}
.msg.user .msg-avatar{background:var(--acc2);border:1px solid var(--acc);color:#f5e8c8}

.dot{width:6px;height:6px;border-radius:50%;background:var(--acc2);animation:pulse 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,60%,100%{opacity:.3}30%{opacity:1}}

.sug-chip{background:none;border:1px solid var(--bdr);border-radius:14px;color:var(--mut);
  cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;
  text-align:left;transition:all .18s}
.sug-chip:hover{border-color:var(--acc2);color:var(--acc)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:center;justify-content:center}
.modal{background:var(--s1);border:1px solid var(--bdr);border-radius:6px;
  padding:24px;max-width:560px;width:90%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:'DM Serif Display',serif;font-size:19px;color:var(--acc);margin-bottom:18px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* autocomplete */
.ac-drop{position:absolute;top:100%;left:0;right:0;background:var(--s3);border:1px solid var(--bdr2);
  border-radius:0 0 4px 4px;z-index:50;max-height:200px;overflow-y:auto;margin-top:-1px}
.ac-item{padding:8px 11px;cursor:pointer;font-size:12px;color:var(--txt);border-bottom:1px solid var(--bdr);transition:background .12s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--s2);color:var(--acc)}
.press-item{display:flex;align-items:center}

/* toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--s2);border:1px solid var(--acc2);
  border-radius:4px;color:var(--acc);font-size:10px;letter-spacing:1px;padding:9px 14px;
  text-transform:uppercase;pointer-events:none;transition:all .25s;z-index:200}

hr.divider{border:none;border-top:1px solid var(--bdr);margin:22px 0}
.empty{color:var(--mut);font-size:12px;padding:30px 0;text-align:center}
.section-label{font-size:9px;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-bottom:12px}


/* ── Mobile sizing fixes ─────────────────────────────── */
@media (max-width: 900px) {
  body { font-size: 15px; }
  .card { padding: 14px 16px; }
  .cell-artist { font-size: 15px; }
  .cell-album  { font-size: 13px; }
  td { padding: 12px 10px; font-size: 14px; }
  th { font-size: 11px; }
  input, select, textarea {
    font-size: 16px !important; /* prevents iOS zoom */
    padding: 12px !important;
  }
  .btn { font-size: 13px; padding: 10px 16px; }
  .btn.pri { font-size: 13px; padding: 10px 16px; }
  .ac-drop { font-size: 15px; }
  .ac-item { padding: 12px 14px; }
  .gap-album { font-size: 12px; padding: 6px 10px; }
  .wish-card h4 { font-size: 15px; }
  .wish-card p  { font-size: 13px; }
  .page-title { font-size: 20px; }
  .modal { padding: 24px 20px; }
  .modal h3 { font-size: 20px; }
  .form-label { font-size: 12px; }
}

async function lastfmGetAlbums(artist) {
  try {
    const url = "https://ws.audioscrobbler.com/2.0/?method=artist.gettopalbums&artist=" + encodeURIComponent(artist) + "&api_key=" + LASTFM_KEY + "&format=json&limit=20";
    const res = await fetch(url);
    const data = await res.json();
    const albums = (data.topalbums && data.topalbums.album) || [];
    return albums.map(function(a) { return a.name; }).filter(function(a) { return a && a !== "(null)"; });
  } catch(e) {
    return [];
  }
}

async function lastfmGetSimilar(artist) {
  try {
    const url = "https://ws.audioscrobbler.com/2.0/?method=artist.getSimilar&artist=" + encodeURIComponent(artist) + "&api_key=" + LASTFM_KEY + "&format=json&limit=10";
    const res = await fetch(url);
    const data = await res.json();
    return ((data.similarartists && data.similarartists.artist) || []).map(function(a) { return a.name; });
  } catch(e) {
    return [];
  }
}

async function mbSearchUpcoming(artist) {
  try {
    // Search MusicBrainz for the artist
    const searchUrl = "https://musicbrainz.org/ws/2/artist/?query=" + encodeURIComponent(artist) + "&fmt=json&limit=1";
    const searchRes = await fetch(searchUrl, {headers:{"User-Agent":"VinylBrain/1.0 (personal vinyl tracker)"}});
    const searchData = await searchRes.json();
    const artists = searchData.artists || [];
    if (!artists.length) return [];
    const mbid = artists[0].id;

    // Get release groups for this artist
    const today = new Date().toISOString().slice(0,10);
    const twoYearsAgo = new Date(Date.now() - 1000*60*60*24*365*2).toISOString().slice(0,10);
    const rgUrl = "https://musicbrainz.org/ws/2/release-group?artist=" + mbid + "&type=album&primary-type=Album&fmt=json&limit=15";
    const rgRes = await fetch(rgUrl, {headers:{"User-Agent":"VinylBrain/1.0 (personal vinyl tracker)"}});
    const rgData = await rgRes.json();
    const groups = rgData["release-groups"] || [];

    // Filter to recent (last 2 years) and upcoming
    // MusicBrainz dates can be "YYYY", "YYYY-MM", or "YYYY-MM-DD"
    return groups
      .filter(function(rg) {
        var date = rg["first-release-date"] || "";
        if (!date) return false;
        // Normalize to YYYY format for comparison
        var year = parseInt(date.slice(0,4));
        var cutoffYear = new Date().getFullYear() - 2;
        return year >= cutoffYear;
      })
      .map(function(rg) {
        var date = rg["first-release-date"] || "";
        // Consider upcoming if date is in the future (compare year-month)
        var isUpcoming = date > today;
        return {
          artist: artist,
          album: rg.title,
          date: date,
          upcoming: isUpcoming
        };
      })
      .sort(function(a,b) { return b.date.localeCompare(a.date); });
  } catch(e) {
    return [];
  }
}

async function mbAutoUpcoming(artists) {
  // Check MusicBrainz for recent/upcoming releases from a list of artists
  var today = new Date().toISOString().slice(0,10);
  var twoYearsAgo = new Date(Date.now() - 1000*60*60*24*365*2).toISOString().slice(0,10);
  var results = [];
  for (var i = 0; i < Math.min(artists.length, 15); i++) {
    var artist = artists[i];
    try {
      var releases = await mbSearchUpcoming(artist);
      releases.forEach(function(r) {
        if (!results.some(function(x){return x.artist===r.artist&&x.album===r.album;})) {
          results.push(r);
        }
      });
      await new Promise(function(res){setTimeout(res, 300);}); // MusicBrainz rate limit
    } catch(e) {}
  }
  return results.sort(function(a,b){return b.date.localeCompare(a.date);});
}

async function sbFetch(path, opts={}) {
  const SUPABASE_URL = getSBUrl();
  const SUPABASE_KEY = getSBKey();
  if (!SUPABASE_URL || !SUPABASE_KEY) return null;
  try {
    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=minimal",
    };
    // Required for DELETE to work on Supabase without RLS
    if (opts.method === "DELETE") headers["Prefer"] = "return=minimal";
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
      ...opts,
      headers,
    });
    // 204 No Content is success for DELETE/POST with return=minimal
    if (res.status === 204 || res.status === 201) return true;
    if (!res.ok) {
      const err = await res.text();
      console.warn("Supabase error:", res.status, err);
      return null;
    }
    const text = await res.text();
    return text ? JSON.parse(text) : true;
  } catch(e) {
    console.warn("Supabase fetch error:", e);
    return null;
  }
}

async function sget(k) {
  const cached = localStorage.getItem(k);
  const localVal = cached ? JSON.parse(cached) : null;
  const table = TABLE_MAP[k];
  if (table && getSBUrl() && getSBKey()) {
    try {
      const rows = await sbFetch(table + "?select=data&order=id");
      if (Array.isArray(rows) && rows.length > 0) {
        const cloudData = rows[0].data || [];
        // Only trust cloud if it has actual data
        if (cloudData.length > 0) {
          localStorage.setItem(k, JSON.stringify(cloudData));
          return cloudData;
        }
      }
      // Cloud empty or missing — use local and push it up
      if (localVal && localVal.length > 0) {
        sset(k, localVal);
        return localVal;
      }
      return null;
    } catch(e) {
      console.warn("sget cloud error, using local:", e);
      return localVal || null;
    }
  }
  return localVal || null;
}

async function sset(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  const table = TABLE_MAP[k];
  if (!table || !getSBUrl() || !getSBKey()) return;
  try {
    const arr = Array.isArray(v) ? v : [];
    // Upsert: update if exists, insert if not
    const row = { id: 1, data: arr };
    const result = await sbFetch(table + "?id=eq.1", {
      method: "PATCH",
      prefer: "return=minimal",
      body: JSON.stringify({ data: arr }),
    });
    // If PATCH found nothing (null result), do an INSERT
    if (result === null) {
      await sbFetch(table, {
        method: "POST",
        prefer: "return=minimal",
        body: JSON.stringify(row),
      });
    }
  } catch(e) {
    console.warn("sset error:", e);
  }
}

function getDecade(year) {
  const y = parseInt(year);
  if (y < 1970) return "60s";
  if (y < 1980) return "70s";
  if (y < 1990) return "80s";
  if (y < 2000) return "90s";
  if (y < 2010) return "00s";
  if (y < 2020) return "10s";
  return "20s";
}

  function DiscoverTab() {
    var discoverState = useState(null);
    var recs = discoverState[0]; var setRecs = discoverState[1];
    var loadingState = useState(false);
    var loading = loadingState[0]; var setLoading = loadingState[1];
    var errorState = useState(null);
    var error = errorState[0]; var setError = errorState[1];
    var expandedState = useState({});
    var expanded = expandedState[0]; var setExpanded = expandedState[1];

    function loadDiscover() {
      setLoading(true); setError(null); setRecs(null);
      var ownedArtists = col.map(function(r){return r.artist;}).filter(Boolean);
      ownedArtists = ownedArtists.filter(function(v,i,a){return a.indexOf(v)===i;});
      if(!ownedArtists.length){setError("Add some records first.");setLoading(false);return;}
      var sample = ownedArtists.sort(function(){return Math.random()-0.5;}).slice(0,12);
      var counts = {};
      var done = 0;
      sample.forEach(function(artist) {
        lastfmGetSimilar(artist).then(function(similar) {
          similar.forEach(function(name) {
            if(!ownedArtists.some(function(o){return o.toLowerCase()===name.toLowerCase();})) {
              counts[name] = (counts[name]||0) + 1;
            }
          });
          done++;
          if(done === sample.length) {
            var top = Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,10);
            if(!top.length){setError("No recommendations found.");setLoading(false);return;}
            var results = [];
            var done2 = 0;
            top.forEach(function(artist) {
              lastfmGetAlbums(artist).then(function(albums) {
                if(albums.length) results.push({artist:artist, albums:albums});
                done2++;
                if(done2===top.length){setRecs(results);setLoading(false);}
              });
            });
          }
        });
      });
    }

    if(!recs && !loading) return (
      <div>
        <div className="card" style={{textAlign:"center",padding:32}}>
          <div style={{fontFamily:"var(--serif)",fontSize:18,color:"var(--acc)",marginBottom:12}}>Discover New Music</div>
          <div style={{color:"var(--mut)",fontSize:12,marginBottom:20,lineHeight:1.6}}>Based on your collection, find artists and albums you might love.</div>
          <button className="btn pri" onClick={loadDiscover}>Generate Recommendations</button>
          {error&&<div style={{color:"var(--red)",fontSize:11,marginTop:12}}>{error}</div>}
        </div>
      </div>
    );

    if(loading) return (
      <div className="card" style={{textAlign:"center",padding:40}}>
        <div style={{color:"var(--acc)",fontFamily:"var(--serif)",fontSize:18,marginBottom:8}}>Searching Last.fm…</div>
        <div style={{color:"var(--mut)",fontSize:12}}>Analyzing your collection.</div>
      </div>
    );

    return (
      <div>
        <div style={{color:"var(--mut)",fontSize:11,marginBottom:16,display:"flex",justifyContent:"space-between"}}>
          <span>{(recs||[]).length} recommended artists</span>
          <button className="btn ghost" style={{fontSize:11}} onClick={loadDiscover}>Refresh</button>
        </div>
        {(recs||[]).map(function(item) {
          var artist = item.artist; var albums = item.albums;
          var isExpanded = expanded[artist];
          var owned = col.filter(function(r){return r.artist===artist;}).map(function(r){return r.album;});
          return (
            <div key={artist} className="gap-artist-section">
              <div className="gap-artist-header">
                <div className="gap-artist-name">{artist}</div>
                <button className="btn ghost" style={{fontSize:10,padding:"2px 8px"}}
                  onClick={function(){setExpanded(function(e){var n=Object.assign({},e);n[artist]=!n[artist];return n;});}}>
                  {isExpanded?"hide":"show albums"}
                </button>
              </div>
              {isExpanded&&(
                <div className="gap-albums" style={{marginTop:8}}>
                  {albums.map(function(album) {
                    var isOwned=owned.some(function(o){return o.toLowerCase().includes(album.toLowerCase().slice(0,10));});
                    var isWished=wish.some(function(w){return w.artist===artist&&w.album===album;});
                    return (
                      <div key={album} className={"gap-album"+(isOwned?" owned":"")} style={isWished&&!isOwned?{borderColor:"var(--acc2)"}:{}}>
                        <span style={{flex:1}}>{album}</span>
                        {isOwned?<span style={{fontSize:9,color:"var(--grn)"}}>owned</span>:(
                          <span className="gap-album-actions">
                            <span className="gap-btn gap-btn-col" onMouseDown={function(e){e.stopPropagation();requireAuth(function(){
                              if(col.some(function(r){return r.artist===artist&&r.album===album;})){showToast("Already owned");return;}
                              setCol(function(prev){return [...prev,{id:Date.now(),artist:artist,album:album,year:"",label:"",genre:"",format:"LP",pressingType:"",pressing:"",notes:"",added:new Date().toISOString()}];});
                              showToast("Added");
                            });}}>+col</span>
                            <span className="gap-btn gap-btn-wish" onMouseDown={function(e){e.stopPropagation();requireAuth(function(){
                              if(wish.some(function(w){return w.artist===artist&&w.album===album;})){showToast("Already watching");return;}
                              setWish(function(prev){return [...prev,{id:Date.now(),artist:artist,album:album,notes:"",alertUnder:null,priority:"medium",added:new Date().toISOString()}];});
                              showToast("Added to watchlist");
                            });}}>+watch</span>
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  }

  function GapAnalysis() {
    const [localSearch, setLocalSearch] = useState("");
    const [localSugs, setLocalSugs] = useState([]);
    const allDiscoArtists = Object.keys(window.DISCOGRAPHIES||{}).sort();
    const artistsInCol = new Set(col.map(r=>r.artist).filter(Boolean));

    function onSearch(v) {
      setLocalSearch(v);
      if (!v.trim()) { setLocalSugs([]); return; }
      const vl = v.toLowerCase();
      const s = allDiscoArtists.filter(a=>a.toLowerCase().startsWith(vl));
      const c = allDiscoArtists.filter(a=>!a.toLowerCase().startsWith(vl)&&a.toLowerCase().includes(vl));
      setLocalSugs([...s,...c].slice(0,12));
    }

    function addArtist(a) {
      if (!browsedArtists.includes(a)) setBrowsedArtists(prev=>[a,...prev]);
      setLocalSearch("");
      setLocalSugs([]);
    }

    function reset() {
      setBrowsedArtists([]);
      setLocalSearch("");
      setLocalSugs([]);
    }

    const displayArtists = [...new Set([
      ...allDiscoArtists.filter(a=>artistsInCol.has(a)),
      ...browsedArtists,
    ])];

    return (
      <div>
        <div style={{position:"relative",marginBottom:16,maxWidth:520}}>
          <input type="text" placeholder="Search any artist..."
            value={localSearch}
            onChange={e=>onSearch(e.target.value)}
            onKeyDown={e=>{
              if(e.key==="Enter"&&localSugs.length){addArtist(localSugs[0]);e.preventDefault();}
              if(e.key==="Escape"){setLocalSearch("");setLocalSugs([]);}
            }}
            onBlur={()=>setTimeout(()=>setLocalSugs([]),200)}
            autoComplete="off"/>
          {localSugs.length>0&&(
            <div className="ac-drop">
              {localSugs.map(a=>(
                <div key={a} className="ac-item" onMouseDown={()=>addArtist(a)}>
                  {a}{artistsInCol.has(a)&&<span style={{color:"var(--grn)",marginLeft:8,fontSize:10}}>owned</span>}
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{color:"var(--mut)",fontSize:11,marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span>{[...artistsInCol].filter(a=>(window.DISCOGRAPHIES||{})[a]).length} from collection
            {browsedArtists.filter(a=>!artistsInCol.has(a)).length>0&&` + ${browsedArtists.filter(a=>!artistsInCol.has(a)).length} browsed`}
          </span>
          {browsedArtists.length>0&&(
            <button className="btn ghost" style={{fontSize:10,padding:"2px 8px"}} onClick={()=>setBrowsedArtists([])}>✕ clear browsed</button>
          )}
          <button className="btn ghost" style={{fontSize:10,padding:"2px 8px"}} onClick={reset}>↺ reset</button>
        </div>

        {displayArtists.length===0&&(
          <div className="card"><div style={{color:"var(--mut)",fontSize:12}}>Search an artist above to explore their discography.</div></div>
        )}

        {displayArtists.map(artist=>{
          const allAlbums=(window.DISCOGRAPHIES||{})[artist]||[];
          const owned=col.filter(r=>r.artist===artist).map(r=>r.album);
          if(!allAlbums.length) return null;
          const pct=Math.round(owned.length/allAlbums.length*100);
          return(
            <div key={artist} className="gap-artist-section">
              <div className="gap-artist-header">
                <div className="gap-artist-name">{artist}</div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:10,color:"var(--mut)"}}>{owned.length}/{allAlbums.length} {pct}%</span>
                  {browsedArtists.includes(artist)&&!artistsInCol.has(artist)&&(
                    <button className="btn ghost" style={{fontSize:9,padding:"2px 6px"}}
                      onClick={()=>setBrowsedArtists(p=>p.filter(a=>a!==artist))}>✕</button>
                  )}
                </div>
              </div>
              <div style={{height:3,background:"var(--bdr)",borderRadius:2,marginBottom:8}}>
                <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,var(--acc2),var(--acc))",borderRadius:2}}/>
              </div>
              <div className="gap-albums">
                {allAlbums.map(album=>{
                  const isOwned=owned.some(o=>o.toLowerCase().includes(album.toLowerCase().slice(0,10)));
                  const isWished=wish.some(w=>w.artist===artist&&w.album===album);
                  return(
                    <div key={album} className={`gap-album${isOwned?" owned":""}`} style={isWished&&!isOwned?{borderColor:"var(--acc2)"}:{}}>
                      <span style={{flex:1}}>{album}</span>
                      {isOwned?<span style={{fontSize:9,color:"var(--grn)"}}>owned</span>:(
                        <span className="gap-album-actions">
                          <span className="gap-btn gap-btn-col" onMouseDown={e=>{e.stopPropagation();requireAuth(()=>{
                            if(col.some(r=>r.artist===artist&&r.album===album)){showToast("Already owned");return;}
                            const meta=(window.ALBUM_META||{})[artist]&&(window.ALBUM_META||{})[artist][album]||{};
                            const yr=(window.ALBUM_YEARS||{})[artist]&&(window.ALBUM_YEARS||{})[artist][album]||"";
                            setCol(prev=>[...prev,{id:Date.now(),artist,album,year:meta.year||yr||"",label:meta.label||"",genre:meta.genre||"",format:"LP",pressingType:"",pressing:"",notes:"",added:new Date().toISOString()}]);
                            showToast("Added to collection");
                          });}}>+col</span>
                          <span className="gap-btn gap-btn-wish" onMouseDown={e=>{e.stopPropagation();requireAuth(()=>{
                            if(wish.some(w=>w.artist===artist&&w.album===album)){showToast("Already on watchlist");return;}
                            setWish(prev=>[...prev,{id:Date.now(),artist,album,notes:"",alertUnder:null,priority:"medium",added:new Date().toISOString()}]);
                            showToast("Added to watchlist");
                          });}}>+watch</span>
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    );
  }


  function AddRecordModal() {
    const [f, setF] = useState({ artist:"", album:"", year:"", label:"", genre:"", format:"LP", pressingType:"", pressing:"", notes:"" });
    const [artistSugs, setArtistSugs] = useState([]);
    const [albumSugs,  setAlbumSugs]  = useState([]);
    const [genreSugs,  setGenreSugs]  = useState([]);
    const albumRef = useRef(null);
    const genreRef = useRef(null);

    const allKnownArtists = [...new Set([...ALL_ARTISTS, ...col.map(r => r.artist).filter(Boolean)])].sort();

    // ── Artist ──
    function onArtistChange(v) {
      setF(x => ({ ...x, artist:v, album:"", year:"", label:"", genre:"", pressing:"" }));
      setAlbumSugs([]);
      if (!v.trim()) { setArtistSugs([]); return; }
      const vl = v.toLowerCase();
      const starts   = allKnownArtists.filter(a => a && a.toLowerCase().startsWith(vl));
      const contains = allKnownArtists.filter(a => a && !a.toLowerCase().startsWith(vl) && a.toLowerCase().includes(vl));
      setArtistSugs([...starts, ...contains].slice(0, 8));
    }

    function pickArtist(a) {
      setF(x => ({ ...x, artist:a, album:"", year:"", label:"", genre:"", pressing:"", pressingType:"" }));
      setArtistSugs([]);
      const albums = [...new Set([...(DISCOGRAPHIES[a]||[]), ...col.filter(r=>r.artist===a).map(r=>r.album)])];
      setAlbumSugs(albums.slice(0, 20));
      setTimeout(() => albumRef.current && albumRef.current.focus(), 50);
    }

    // ── Album ──
    function onAlbumChange(v) {
      setF(x => ({ ...x, album:v, year:"", label:"", genre:"", pressing:"" }));
      if (!v.trim()) { setAlbumSugs([]); return; }
      const knownAlbums = [...new Set([...(DISCOGRAPHIES[f.artist]||[]), ...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
      const vl = v.toLowerCase();
      const starts   = knownAlbums.filter(a => a.toLowerCase().startsWith(vl));
      const contains = knownAlbums.filter(a => !a.toLowerCase().startsWith(vl) && a.toLowerCase().includes(vl));
      setAlbumSugs([...new Set([...starts,...contains])].slice(0, 8));
    }

    function pickAlbum(a) {
      const meta = (ALBUM_META[f.artist]&&ALBUM_META[f.artist][a])||{};
      const yearFallback = (ALBUM_YEARS[f.artist]&&ALBUM_YEARS[f.artist][a])||"";
      setF(x => ({
        ...x, album:a,
        year:  x.year  || meta.year  || yearFallback,
        label: x.label || meta.label || "",
        genre: x.genre || meta.genre || "",
      }));
      setAlbumSugs([]);
      setTimeout(() => genreRef.current && genreRef.current.focus(), 50);
    }

    function onAlbumFocus() {
      if (f.artist) {
        const albums = [...new Set([...(DISCOGRAPHIES[f.artist]||[]), ...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
        if (albums.length) setAlbumSugs(albums.slice(0, 20));
      }
    }

    // ── Genre ──
    function onGenreChange(v) {
      setF(x => ({ ...x, genre:v }));
      if (!v.trim()) { setGenreSugs([]); return; }
      const vl = v.toLowerCase();
      // also include genres from user's own collection
      const userGenres = [...new Set(col.map(r=>r.genre).filter(Boolean))];
      const allGenres  = [...new Set([...GENRES, ...userGenres])].sort();
      const starts   = allGenres.filter(g => g.toLowerCase().startsWith(vl));
      const contains = allGenres.filter(g => !g.toLowerCase().startsWith(vl) && g.toLowerCase().includes(vl));
      setGenreSugs([...starts,...contains].slice(0, 6));
    }

    function pickGenre(g) { setF(x=>({...x,genre:g})); setGenreSugs([]); }

    // ── highlight match ──
    function highlight(str, query) {
      if (!query) return str;
      const idx = str.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return str;
      return <>{str.slice(0,idx)}<strong style={{color:"var(--acc)"}}>{str.slice(idx,idx+query.length)}</strong>{str.slice(idx+query.length)}</>;
    }

    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setModal(null)}>
        <div className="modal" style={{maxWidth:620}}>
          <h3>Add to Collection</h3>
          <div className="form-grid">

            {/* Artist */}
            <div className="field" style={{position:"relative"}}>
              <label>Artist *</label>
              <input type="text" placeholder="Start typing…" value={f.artist} autoFocus
                onChange={e=>onArtistChange(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&artistSugs.length){pickArtist(artistSugs[0]);e.preventDefault();}if(e.key==="Escape")setArtistSugs([]);}}
                onBlur={()=>setTimeout(()=>setArtistSugs([]),200)}
              />
              {artistSugs.length>0&&<div className="ac-drop">{artistSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickArtist(a)}>{highlight(a,f.artist)}</div>)}</div>}
            </div>

            {/* Album */}
            <div className="field" style={{position:"relative"}}>
              <label>Album *
                {f.artist&&DISCOGRAPHIES[f.artist]&&<span style={{color:"var(--mut)",fontSize:9,marginLeft:6}}>{DISCOGRAPHIES[f.artist].length} known</span>}
              </label>
              <input ref={albumRef} type="text" placeholder={f.artist?"Start typing or click to see all…":"Pick artist first"} value={f.album}
                disabled={!f.artist}
                onChange={e=>onAlbumChange(e.target.value)}
                onFocus={onAlbumFocus}
                onKeyDown={e=>{if(e.key==="Enter"&&albumSugs.length){pickAlbum(albumSugs[0]);e.preventDefault();}if(e.key==="Escape")setAlbumSugs([]);}}
                onBlur={()=>setTimeout(()=>setAlbumSugs([]),200)}
              />
              {albumSugs.length>0&&<div className="ac-drop">{albumSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickAlbum(a)}>{highlight(a,f.album)}</div>)}</div>}
            </div>

  function EditRecordModal({ record }) {
    const [f, setF] = useState({ ...record });
    const [artistSugs, setArtistSugs] = useState([]);
    const [albumSugs,  setAlbumSugs]  = useState([]);
    const [genreSugs,  setGenreSugs]  = useState([]);
    const albumRef = useRef(null);
    const genreRef = useRef(null);
    const allKnownArtists = [...new Set([...ALL_ARTISTS, ...col.map(r=>r.artist).filter(Boolean)])].sort();

    function onArtistChange(v) {
      setF(x=>({...x,artist:v}));
      if(!v.trim()){setArtistSugs([]);return;}
      const vl=v.toLowerCase();
      const s=allKnownArtists.filter(a=>a&&a.toLowerCase().startsWith(vl));
      const c=allKnownArtists.filter(a=>a&&!a.toLowerCase().startsWith(vl)&&a.toLowerCase().includes(vl));
      setArtistSugs([...s,...c].slice(0,8));
    }
    function pickArtist(a){setF(x=>({...x,artist:a}));setArtistSugs([]);setTimeout(()=>albumRef.current && albumRef.current.focus(),50);}

    function onAlbumChange(v) {
      setF(x=>({...x,album:v}));
      if(!v.trim()){setAlbumSugs([]);return;}
      const knownAlbums=[...new Set([...(DISCOGRAPHIES[f.artist]||[]),...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
      const vl=v.toLowerCase();
      const s=knownAlbums.filter(a=>a.toLowerCase().startsWith(vl));
      const c=knownAlbums.filter(a=>!a.toLowerCase().startsWith(vl)&&a.toLowerCase().includes(vl));
      setAlbumSugs([...new Set([...s,...c])].slice(0,8));
    }
    function pickAlbum(a){
      const meta=(ALBUM_META[f.artist]&&ALBUM_META[f.artist][a])||{};
      const yearFallback=(ALBUM_YEARS[f.artist]&&ALBUM_YEARS[f.artist][a])||"";
      setF(x=>({...x,album:a,year:x.year||meta.year||yearFallback,label:x.label||meta.label||"",genre:x.genre||meta.genre||""}));
      setAlbumSugs([]);
    }
    function onAlbumFocus(){
      if(!f.album&&f.artist){
        const albums=[...new Set([...(DISCOGRAPHIES[f.artist]||[]),...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
        if(albums.length)setAlbumSugs(albums.slice(0,10));
      }
    }
    function onGenreChange(v){
      setF(x=>({...x,genre:v}));
      if(!v.trim()){setGenreSugs([]);return;}
      const vl=v.toLowerCase();
      const allG=[...new Set([...GENRES,...col.map(r=>r.genre).filter(Boolean)])].sort();
      setGenreSugs([...allG.filter(g=>g.toLowerCase().startsWith(vl)),...allG.filter(g=>!g.toLowerCase().startsWith(vl)&&g.toLowerCase().includes(vl))].slice(0,6));
    }
    function pickGenre(g){setF(x=>({...x,genre:g}));setGenreSugs([]);}

    function hl(str,q){
      if(!q)return str;
      const idx=str.toLowerCase().indexOf(q.toLowerCase());
      if(idx===-1)return str;
      return <>{str.slice(0,idx)}<strong style={{color:"var(--acc)"}}>{str.slice(idx,idx+q.length)}</strong>{str.slice(idx+q.length)}</>;
    }

    return (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
        <div className="modal" style={{maxWidth:620}}>
          <h3>Edit Record</h3>
          <div className="form-grid">
            <div className="field" style={{position:"relative"}}>
              <label>Artist *</label>
              <input type="text" value={f.artist} onChange={e=>onArtistChange(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&artistSugs.length){pickArtist(artistSugs[0]);e.preventDefault();}if(e.key==="Escape")setArtistSugs([]);}}
                onBlur={()=>setTimeout(()=>setArtistSugs([]),200)}/>
              {artistSugs.length>0&&<div className="ac-drop">{artistSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickArtist(a)}>{hl(a,f.artist)}</div>)}</div>}
            </div>
            <div className="field" style={{position:"relative"}}>
              <label>Album *</label>
              <input ref={albumRef} type="text" value={f.album}
                onChange={e=>onAlbumChange(e.target.value)}
                onFocus={onAlbumFocus}
                onKeyDown={e=>{if(e.key==="Enter"&&albumSugs.length){pickAlbum(albumSugs[0]);e.preventDefault();}if(e.key==="Escape")setAlbumSugs([]);}}
                onBlur={()=>setTimeout(()=>setAlbumSugs([]),200)}/>
              {albumSugs.length>0&&<div className="ac-drop">{albumSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickAlbum(a)}>{hl(a,f.album)}</div>)}</div>}
            </div>
            <div className="field"><label>Year</label><input type="text" value={f.year||""} onChange={e=>setF(x=>({...x,year:e.target.value}))}/></div>
            <div className="field" style={{position:"relative"}}>
              <label>Genre</label>
              <input ref={genreRef} type="text" value={f.genre||""} onChange={e=>onGenreChange(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&genreSugs.length){pickGenre(genreSugs[0]);e.preventDefault();}if(e.key==="Escape")setGenreSugs([]);}}
                onBlur={()=>setTimeout(()=>setGenreSugs([]),200)}/>
              {genreSugs.length>0&&<div className="ac-drop">{genreSugs.map(g=><div key={g} className="ac-item" onMouseDown={()=>pickGenre(g)}>{hl(g,f.genre)}</div>)}</div>}
            </div>
            <div className="field"><label>Label</label><input type="text" value={f.label||""} onChange={e=>setF(x=>({...x,label:e.target.value}))}/></div>
            <div className="field">
              <label>Format</label>
              <select value={f.format||"LP"} onChange={e=>setF(x=>({...x,format:e.target.value}))}>
                {["LP","2xLP","3xLP","EP","12-inch Single","10\" Single","7\" Single","Box Set","Picture Disc","Colored Vinyl","Test Pressing"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Pressing Type</label>
              <select value={f.pressingType||""} onChange={e=>setF(x=>({...x,pressingType:e.target.value}))}>
                <option value="">— select —</option>
                <option>Original</option><option>Original US</option><option>Original UK</option>
                <option>Original EU</option><option>Original JP</option><option>Original AU</option>
                <option>Original CA</option><option>Reissue</option><option>Reissue US</option>
                <option>Reissue UK</option><option>Reissue EU</option><option>Reissue JP</option>
                <option>Repress</option><option>180g Reissue</option><option>Anniversary Edition</option>
                <option>Deluxe Edition</option><option>Limited Edition</option>
                <option>Promo Copy</option><option>Test Pressing</option><option>Bootleg</option>
              </select>
            </div>
            <div className="field"><label>Pressing Details</label><input type="text" value={f.pressing||""} onChange={e=>setF(x=>({...x,pressing:e.target.value}))}/></div>
            <div className="field full"><label>Notes</label><input type="text" value={f.notes||""} onChange={e=>setF(x=>({...x,notes:e.target.value}))}/></div>
          </div>
          <div className="modal-footer" style={{justifyContent:"space-between"}}>
            <button className="btn danger" onClick={()=>{if(!window.confirm("Remove this record?"))return;setCol(prev=>prev.filter(r=>r.id!==record.id));setModal(null);showToast("Record removed");}}>Remove</button>
            <div style={{display:"flex",gap:8}}>
              <button className="btn ghost" onClick={()=>setModal(null)}>Cancel</button>
              <button className="btn pri" onClick={()=>{if(!f.artist.trim()||!f.album.trim()){showToast("Artist + Album required");return;}editRecord(f);}}>Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function AddWishModal({ prefill }) {
    const [f, setF] = useState({
      artist: (prefill && prefill.artist) || "",
      album:  (prefill && prefill.album)  || "",
      notes: "", alertUnder: "", priority: "medium"
    });
    const [artistSugs, setArtistSugs] = useState([]);
    const [albumSugs,  setAlbumSugs]  = useState([]);

    function onArtistChange(v) {
      setF(x => ({...x, artist:v, album:""}));
      if (!v) { setArtistSugs([]); return; }
      const vl = v.toLowerCase();
      const s = window.ALL_ARTISTS.filter(a => a.toLowerCase().startsWith(vl));
      const c = window.ALL_ARTISTS.filter(a => !a.toLowerCase().startsWith(vl) && a.toLowerCase().includes(vl));
      setArtistSugs([...s, ...c].slice(0, 8));
    }
    function pickArtist(a) {
      setF(x => ({...x, artist:a, album:""}));
      setArtistSugs([]);
      const albums = [...new Set([...(window.DISCOGRAPHIES[a]||[])])];
      setAlbumSugs(albums.slice(0, 20));
    }
    function onAlbumChange(v) {
      setF(x => ({...x, album:v}));
      if (!f.artist) return;
      const all = window.DISCOGRAPHIES[f.artist] || [];
      setAlbumSugs(v ? all.filter(a => a.toLowerCase().includes(v.toLowerCase())).slice(0,12) : all.slice(0,20));
    }
    function pickAlbum(a) {
      setF(x => ({...x, album:a}));
      setAlbumSugs([]);
    }

    function save() {
      if (!f.artist.trim() || !f.album.trim()) return;
      requireAuth(() => {
        if (wish.some(w => w.artist===f.artist && w.album===f.album)) { showToast("Already on watchlist"); return; }
        setWish(prev => [...prev, {
          id: Date.now(), artist:f.artist.trim(), album:f.album.trim(),
          notes:f.notes, alertUnder: f.alertUnder ? parseFloat(f.alertUnder) : null,
          priority:f.priority, added:new Date().toISOString()
        }]);
        setModal(null);
        showToast("Added to watchlist");
      });
    }

    return (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
        <div className="modal">
          <h3>Add to Watchlist</h3>

          {/* Artist */}
          <div className="form-row" style={{position:"relative"}}>
            <label className="form-label">Artist *</label>
            <input value={f.artist} onChange={e=>onArtistChange(e.target.value)}
              onBlur={()=>setTimeout(()=>setArtistSugs([]),200)}
              placeholder="Start typing..." autoComplete="off"/>
            {artistSugs.length>0 && (
              <div className="ac-drop">
                {artistSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickArtist(a)}>{a}</div>)}
              </div>
            )}
          </div>

          {/* Album */}
          <div className="form-row" style={{position:"relative"}}>
            <label className="form-label">Album *</label>
            <input value={f.album}
              onChange={e=>onAlbumChange(e.target.value)}
              onFocus={()=>{if(f.artist){const all=window.DISCOGRAPHIES[f.artist]||[];setAlbumSugs(all.slice(0,20));}}}
              onBlur={()=>setTimeout(()=>setAlbumSugs([]),200)}
              disabled={!f.artist}
              placeholder={f.artist?"Type or pick album...":"Pick artist first"}
              autoComplete="off"/>
            {albumSugs.length>0 && (
              <div className="ac-drop">
                {albumSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickAlbum(a)}>{a}</div>)}
              </div>
            )}
          </div>

          <div className="form-row">
            <label className="form-label">Alert under $</label>
            <input value={f.alertUnder} onChange={e=>setF(x=>({...x,alertUnder:e.target.value}))}
              placeholder="e.g. 75" type="number"/>
          </div>

          <div className="form-row">
            <label className="form-label">Notes</label>
            <input value={f.notes} onChange={e=>setF(x=>({...x,notes:e.target.value}))}
              placeholder="e.g. Original pressing only"/>
          </div>

          <div className="form-row">
            <label className="form-label">Priority</label>
            <select value={f.priority} onChange={e=>setF(x=>({...x,priority:e.target.value}))}>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div className="modal-footer">
            <button className="btn ghost" onClick={()=>setModal(null)}>Cancel</button>
            <button className="btn pri" onClick={save}>Save</button>
          </div>
        </div>
      </div>
    );
  }

                          <td style={{color:"var(--mut)",fontSize:11}}>{[r.pressingType,r.pressing].filter(Boolean).join(" · ")||"—"}</td>
                          <td style={{display:"flex",gap:5}} onClick={e=>e.stopPropagation()}>
                            <button className="btn ghost" style={{fontSize:9,padding:"3px 7px"}} onClick={()=>setModal({type:"edit-record",record:r})}>✎</button>
                            <button className="btn danger" style={{fontSize:9,padding:"3px 7px"}} onClick={()=>removeRecord(r.id)}>✕</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
              }
            </div>
          )}

          {/* WATCHLIST */}
          {tab==="watchlist" && (
            <div className="page">
              <div className="page-hd">
                <div className="page-title">The <em>Hunt</em></div>
                <button className="btn pri" onClick={()=>setModal("add-wish")}>+ Add Item</button>
              </div>
              {wish.length===0
                ? <div className="empty">Nothing on your watchlist yet.</div>
                : <div className="card-grid">
                    {wish.map(w=>(
                      <div className="wish-card" key={w.id}>
                        <div className="wish-card-top">
                          <div className="wish-card-info">
                            <h4>{w.artist}</h4>
                            <p style={{fontStyle:"italic",marginBottom:4}}>{w.album}</p>
                            {w.notes&&<p>{w.notes}</p>}
                          </div>
                          <button className="btn danger" style={{fontSize:9,padding:"3px 7px",flexShrink:0}} onClick={()=>removeWish(w.id)}>✕</button>
                        </div>
                        <div className="wish-card-bottom">
                          <span className={`badge ${priClass(w.priority)}`}>{w.priority||"medium"}</span>
                          {w.alertUnder&&<span className="alert-chip">🔔 under ${w.alertUnder}</span>}
                          <button className="btn ghost" style={{marginLeft:"auto",fontSize:9,padding:"3px 9px"}}
onClick={()=>{}}>Details
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
              }
            </div>
          )}

          {/* GAP ANALYSIS */}
          {tab==="gaps" && (
            <div className="page">
              <div className="page-hd">
                <div className="page-title"><em>Gap</em> Analysis</div>
                <span style={{color:"var(--mut)",fontSize:11}}>Click missing albums to add to watchlist</span>
              </div>
              <GapAnalysis/>
            </div>
          )}

          {/* UPCOMING */}
                    {tab==="upcoming" && (
            <div className="page">
              <div className="page-hd">
                <div className="page-title"><em>Upcoming</em></div>
              </div>

              {/* Search for artist releases */}
              <UpcomingSearch up={up} setUp={setUp} requireAuth={requireAuth} showToast={showToast}/>
            </div>
          )}

          {tab==="discover" && (
            <div className="page">
              <div className="page-hd"><div className="page-title"><em>Discover</em></div></div>
              <DiscoverTab/>
            </div>
          )}

          {tab==="settings" && (
            <div className="page">
              <div className="page-hd"><div className="page-title"><em>Settings</em><a href="https://www.last.fm/music/+releases/new" target="_blank" rel="noopener noreferrer" className="btn ghost" style={{fontSize:11,marginLeft:8}}>Last.fm New Releases</a></div></div>
              <SettingsPanel/>
            </div>
          )}

      </div>{/* end main content area */}
    </div>{/* end shell */}

      {/* Auth Modal */}
      {authModal && (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth:340}}>
            <h3>Password Required</h3>
            <p style={{color:"var(--mut)",fontSize:12,marginBottom:16}}>Enter password to make changes.</p>
            <input type="password" placeholder="Password" value={authInput}
              style={{width:"100%",marginBottom:8}}
              autoComplete="off"
              onChange={e=>setAuthInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&submitAuth()}
              ref={el=>el&&el.focus()}/>
            {authError&&<div style={{color:"var(--red)",fontSize:11,marginBottom:8}}>{authError}</div>}
            <div className="modal-footer">
              <button className="btn ghost" onClick={()=>setAuthModal(false)}>Cancel</button>
              <button className="btn pri" onClick={submitAuth}>Unlock</button>
            </div>
          </div>
        </div>
      )}

      {modal==="add-record" && <AddRecordModal/>}
      {modal && modal.type==="edit-record" && <EditRecordModal record={modal.record}/>}
      {modal==="add-wish" && <AddWishModal prefill={null}/>}
      {modal==="add-up" && <AddUpModal/>}
      {modal && modal.type==="add-to-wish" && <AddWishModal prefill={modal}/>}

      <div className="toast" style={{opacity:toast.on?1:0,transform:toast.on?"translateY(0)":"translateY(6px)"}}>{toast.msg}</div>
    </>
  );
}

function MobileApp() {
  const [tab, setTab] = useState("collection");
  const [col, setCol] = useState([]);
  const [wish, setWish] = useState([]);
  const [up, setUp] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState({msg:"",on:false});
  const [mAuthModal, setMAuthModal] = useState(false);
  const [mAuthInput, setMAuthInput] = useState("");
  const [mAuthError, setMAuthError] = useState("");
  const [mModal, setMModal] = useState(null);
  const [mForm, setMForm] = useState({artist:"",album:"",year:"",format:"LP",pressingType:"",notes:""});
  const [mArtistSugs, setMArtistSugs] = useState([]);
  const [mAlbumSugs, setMAlbumSugs] = useState([]);
  const [gapQuery, setGapQuery] = useState("");
  const [gapSugs, setGapSugs] = useState([]);
  const [gapArtists, setGapArtists] = useState([]);
  const mAuthCbRef = useRef(null);

  useEffect(function() {
    (async function() {
      const c = await sget(K.COL); if(c) setCol(c);
      var w = await sget(K.WISH);
      if(!w||!w.length){w=SEED_WISH;await sset(K.WISH,w);}
      setWish(w);
      const u = await sget(K.UP); if(u) setUp(u);
      setLoaded(true);
    })();
  }, []);

  useEffect(function(){if(loaded)sset(K.COL,col);},[col,loaded]);
  useEffect(function(){if(loaded)sset(K.WISH,wish);},[wish,loaded]);
  useEffect(function(){if(loaded)sset(K.UP,up);},[up,loaded]);

  const showToast = function(msg) { setToast({msg:msg,on:true}); setTimeout(function(){setToast(function(t){return {...t,on:false};});},2200); };

  function mRequireAuth(cb) {
    if(isAdmin()){cb();return;}
    setMAuthInput(""); setMAuthError("");
    mAuthCbRef.current = cb; setMAuthModal(true);
  }
  function mSubmitAuth() {
    if(mAuthInput===ADMIN_PW){
      sessionStorage.setItem("vb_auth","ok");
      setMAuthModal(false);
      if(mAuthCbRef.current)mAuthCbRef.current();
    } else { setMAuthError("Incorrect password"); setMAuthInput(""); }
  }

  function onMArtistChange(v) {
    setMForm(function(x){return {...x,artist:v,album:"",year:""};});
    if(!v){setMArtistSugs([]);return;}
    const vl=v.toLowerCase();
    const s=window.ALL_ARTISTS.filter(function(a){return a.toLowerCase().startsWith(vl);});
    const c=window.ALL_ARTISTS.filter(function(a){return !a.toLowerCase().startsWith(vl)&&a.toLowerCase().includes(vl);});
    setMArtistSugs([...s,...c].slice(0,8));
  }
  function pickMArtist(a) {
    const albums=[...new Set([...(window.DISCOGRAPHIES[a]||[])])];
    setMForm(function(x){return {...x,artist:a,album:"",year:""};});
    setMArtistSugs([]);
    setMAlbumSugs(albums.slice(0,20));
  }
  function onMAlbumChange(v) {
    setMForm(function(x){return {...x,album:v};});
    if(!mForm.artist)return;
    const all=window.DISCOGRAPHIES[mForm.artist]||[];
    setMAlbumSugs(v?all.filter(function(a){return a.toLowerCase().includes(v.toLowerCase());}).slice(0,12):all.slice(0,20));
  }
  function pickMAlbum(a) {
    const meta=(window.ALBUM_META[mForm.artist]&&window.ALBUM_META[mForm.artist][a])||{};
    const yr=(window.ALBUM_YEARS[mForm.artist]&&window.ALBUM_YEARS[mForm.artist][a])||"";
    setMForm(function(x){return {...x,album:a,year:x.year||meta.year||yr||""};});
    setMAlbumSugs([]);
  }

  function onGapQuery(v) {
    setGapQuery(v);
    if(!v.trim()){setGapSugs([]);return;}
    const vl=v.toLowerCase();
    const s=Object.keys(window.DISCOGRAPHIES).filter(function(a){return a.toLowerCase().startsWith(vl);});
    const c=Object.keys(window.DISCOGRAPHIES).filter(function(a){return !a.toLowerCase().startsWith(vl)&&a.toLowerCase().includes(vl);});
    setGapSugs([...s,...c].slice(0,10));
  }
  function addGapArtist(a) {
    if(!gapArtists.includes(a))setGapArtists(function(prev){return [a,...prev];});
    setGapQuery(""); setGapSugs([]);
  }

  const TABS = [
    {id:"collection",icon:"◉",label:"Collection"},
    {id:"watchlist", icon:"◈",label:"Watchlist"},
    {id:"gaps",      icon:"◻",label:"Gaps"},
    {id:"upcoming",  icon:"◷",label:"Upcoming"},
    {id:"discover",  icon:"◉",label:"Discover"},
    {id:"settings",  icon:"◎",label:"Settings"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",background:"var(--bg)",color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,overflow:"hidden"}}>
      <div style={{padding:"12px 16px 8px",borderBottom:"1px solid var(--bdr)",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontFamily:"var(--serif)",fontSize:20,color:"var(--acc)",fontStyle:"italic"}}>VinylBrain</div>
        <div style={{fontSize:11,color:"var(--mut)"}}>{col.length} records</div>
      </div>

      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 16px 80px"}}>

        {tab==="collection" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{color:"var(--mut)",fontSize:11}}>{col.length} records</div>
              <button className="btn pri" onClick={function(){setMModal("add-record");}}>+ Add Record</button>
            </div>
            {col.length===0
              ? <div className="card" style={{color:"var(--mut)",textAlign:"center",fontSize:12,padding:24}}>No records yet.</div>
              : [...col].sort(function(a,b){return a.artist.localeCompare(b.artist);}).map(function(r) {
                return (
                  <div key={r.id} className="card" style={{marginBottom:8,display:"flex",gap:12,alignItems:"center"}}>
                    <AlbumArt artist={r.artist} album={r.album} size={56}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13}}>{r.artist}</div>
                      <div style={{color:"var(--mut)",fontSize:12,fontStyle:"italic",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.album}</div>
                      <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
                        {r.year&&<span style={{fontSize:10,color:"var(--acc)"}}>{r.year}</span>}
                        {r.genre&&<span style={{fontSize:10,color:"var(--acc2)"}}>{r.genre}</span>}
                        {r.format&&r.format!=="LP"&&<span style={{fontSize:10,color:"var(--mut)"}}>{r.format}</span>}
                        {r.pressingType&&<span style={{fontSize:10,color:"var(--mut)"}}>{r.pressingType}</span>}
                      </div>
                    </div>
                    <button className="btn ghost" style={{fontSize:10,padding:"3px 8px",flexShrink:0,color:"var(--red)",borderColor:"#3a1a1a"}}
                      onClick={function(){mRequireAuth(function(){if(!window.confirm("Remove?"))return;setCol(function(prev){return prev.filter(function(x){return x.id!==r.id;});});showToast("Removed");});}}>✕</button>
                  </div>
                );
              })
            }
          </div>
        )}

        {tab==="watchlist" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{color:"var(--mut)",fontSize:11}}>{wish.length} items</div>
              <button className="btn pri" onClick={function(){setMModal("add-wish");}}>+ Add</button>
            </div>
            {wish.length===0
              ? <div className="card" style={{color:"var(--mut)",textAlign:"center",fontSize:12,padding:24}}>Nothing on watchlist.</div>
              : wish.map(function(w) {
                return (
                  <div key={w.id} className="card" style={{marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600}}>{w.artist}</div>
                      <div style={{color:"var(--mut)",fontSize:12,fontStyle:"italic"}}>{w.album}</div>
                      {w.alertUnder&&<div style={{fontSize:10,color:"var(--acc2)",marginTop:2}}>Alert under ${w.alertUnder}</div>}
                    </div>
                    <button className="btn ghost" style={{fontSize:10,padding:"2px 8px"}}
                      onClick={function(){mRequireAuth(function(){setWish(function(prev){return prev.filter(function(x){return x.id!==w.id;});});});}}>✕</button>
                  </div>
                );
              })
            }
          </div>
        )}

        {tab==="gaps" && (
          <div>
            <div style={{position:"relative",marginBottom:14}}>
              <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",boxSizing:"border-box"}}
                placeholder="Search any artist..." value={gapQuery}
                onChange={function(e){onGapQuery(e.target.value);}}
                onKeyDown={function(e){if(e.key==="Enter"&&gapSugs.length){addGapArtist(gapSugs[0]);e.preventDefault();}}}
                onBlur={function(){setTimeout(function(){setGapSugs([]);},200);}}
                autoComplete="off"/>
              {gapSugs.length>0&&(
                <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:3,zIndex:50,maxHeight:200,overflowY:"auto"}}>
                  {gapSugs.map(function(a){return <div key={a} style={{padding:"10px 12px",borderBottom:"1px solid var(--bdr)",fontSize:12,cursor:"pointer"}} onMouseDown={function(){addGapArtist(a);}}>{a}</div>;})}
                </div>
              )}
            </div>
            {gapArtists.length>0&&(
              <button className="btn ghost" style={{fontSize:10,padding:"2px 8px",marginBottom:12}} onClick={function(){setGapArtists([]);setGapQuery("");}}>↺ reset</button>
            )}
            {gapArtists.length===0&&<div className="card" style={{color:"var(--mut)",fontSize:12,textAlign:"center",padding:20}}>Search an artist to see their discography.</div>}
            {gapArtists.map(function(artist) {
              const all=window.DISCOGRAPHIES[artist]||[];
              const owned=col.filter(function(r){return r.artist===artist;}).map(function(r){return r.album;});
              if(!all.length)return null;
              return(
                <div key={artist} className="card" style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontFamily:"var(--serif)",color:"var(--acc)",fontSize:15}}>{artist}</div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:10,color:"var(--mut)"}}>{owned.length}/{all.length}</span>
                      <button className="btn ghost" style={{fontSize:10,padding:"2px 8px"}} onClick={function(){setGapArtists(function(p){return p.filter(function(a){return a!==artist;});});}}>✕</button>
                    </div>
                  </div>
                  <div style={{height:3,background:"var(--bdr)",borderRadius:2,marginBottom:8}}>
                    <div style={{height:"100%",width:Math.round(owned.length/all.length*100)+"%",background:"linear-gradient(90deg,var(--acc2),var(--acc))",borderRadius:2}}/>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {all.map(function(album){
                      const own=owned.some(function(o){return o.toLowerCase().includes(album.toLowerCase().slice(0,10));});
                      return(
                        <div key={album} style={{fontSize:10,padding:"4px 8px",border:"1px solid",borderRadius:3,
                          borderColor:own?"var(--grn)":"var(--bdr)",color:own?"var(--grn)":"var(--fg)",
                          background:own?"rgba(74,140,92,0.1)":"transparent",cursor:own?"default":"pointer"}}
                          onMouseDown={function(){
                            if(own)return;
                            mRequireAuth(function(){
                              const meta=(window.ALBUM_META[artist]&&window.ALBUM_META[artist][album])||{};
                              const yr=(window.ALBUM_YEARS[artist]&&window.ALBUM_YEARS[artist][album])||"";
                              setCol(function(prev){return [...prev,{id:Date.now(),artist:artist,album:album,year:meta.year||yr,label:meta.label||"",genre:meta.genre||"",format:"LP",pressingType:"",pressing:"",notes:"",added:new Date().toISOString()}];});
                              showToast("Added: "+album);
                            });
                          }}>
                          {album}{own?" ✓":""}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab==="upcoming" && (
          <div style={{paddingBottom:8}}>
            <UpcomingSearch up={up} setUp={setUp} requireAuth={mRequireAuth} showToast={showToast}/>
          </div>
        )}

        {tab==="discover" && (
          <div style={{paddingBottom:8}}>
            <DiscoverTab/>
          </div>
        )}

        {tab==="settings" && (
          <div className="card">
            <div style={{fontFamily:"var(--serif)",color:"var(--acc)",fontSize:16,marginBottom:10}}>Cloud Sync</div>
            <div style={{fontSize:11,color:getSBUrl()?"var(--grn)":"var(--mut)",marginBottom:8}}>
              {getSBUrl()?"✓ Connected":"Not connected — configure on desktop"}
            </div>
            <div style={{fontSize:11,color:"var(--mut)"}}>Collection syncs automatically when connected.</div>
          </div>
        )}
      </div>

      <div style={{position:"fixed",bottom:0,left:0,right:0,display:"flex",borderTop:"1px solid var(--bdr)",background:"var(--bg2)",paddingBottom:"env(safe-area-inset-bottom,0px)",zIndex:50}}>
        {TABS.map(function(t) {
          const active = tab===t.id;
          return (
            <button key={t.id} onClick={function(){setTab(t.id);}}
              style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,background:"none",border:"none",borderTop:active?"2px solid var(--acc)":"2px solid transparent",color:active?"var(--acc)":"var(--mut)",fontSize:8,fontFamily:"sans-serif",padding:"7px 2px 5px",cursor:"pointer"}}>
              <span style={{fontSize:14,lineHeight:1}}>{t.icon}</span>
              {t.label}
            </button>
          );
        })}
      </div>

      {/* Add Record Modal */}
      {mModal==="add-record" && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"var(--bg2)",borderRadius:"12px 12px 0 0",padding:"20px 16px",width:"100%",maxHeight:"88vh",overflowY:"auto",boxSizing:"border-box"}}>
            <div style={{fontFamily:"var(--serif)",color:"var(--acc)",fontSize:18,marginBottom:16}}>Add Record</div>
            <div style={{position:"relative",marginBottom:10}}>
              <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",boxSizing:"border-box"}}
                placeholder="Artist *" value={mForm.artist}
                onChange={function(e){onMArtistChange(e.target.value);}}
                onBlur={function(){setTimeout(function(){setMArtistSugs([]);},200);}}
                autoComplete="off"/>
              {mArtistSugs.length>0&&(
                <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:3,zIndex:50,maxHeight:180,overflowY:"auto"}}>
                  {mArtistSugs.map(function(a){return <div key={a} style={{padding:"10px 12px",borderBottom:"1px solid var(--bdr)",fontSize:12,cursor:"pointer"}} onMouseDown={function(){pickMArtist(a);}}>{a}</div>;})}
                </div>
              )}
            </div>
            <div style={{position:"relative",marginBottom:10}}>
              <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",boxSizing:"border-box"}}
                placeholder={mForm.artist?"Album *":"Pick artist first"} value={mForm.album}
                disabled={!mForm.artist}
                onChange={function(e){onMAlbumChange(e.target.value);}}
                onFocus={function(){if(mForm.artist){const all=window.DISCOGRAPHIES[mForm.artist]||[];setMAlbumSugs(all.slice(0,20));}}}
                onBlur={function(){setTimeout(function(){setMAlbumSugs([]);},200);}}
                autoComplete="off"/>
              {mAlbumSugs.length>0&&(
                <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--card)",border:"1px solid var(--bdr)",borderRadius:3,zIndex:50,maxHeight:200,overflowY:"auto"}}>
                  {mAlbumSugs.map(function(a){return <div key={a} style={{padding:"10px 12px",borderBottom:"1px solid var(--bdr)",fontSize:12,cursor:"pointer"}} onMouseDown={function(){pickMAlbum(a);}}>{a}</div>;})}
                </div>
              )}
            </div>
            <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:10,outline:"none",boxSizing:"border-box"}}
              placeholder="Year (auto-fills)" value={mForm.year}
              onChange={function(e){setMForm(function(x){return {...x,year:e.target.value};});}}/>
            <select style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:10,outline:"none"}}
              value={mForm.format} onChange={function(e){setMForm(function(x){return {...x,format:e.target.value};});}}>
              {["LP","2xLP","3xLP","EP","12-inch Single","7-inch Single","Box Set","Picture Disc","Colored Vinyl"].map(function(v){return <option key={v}>{v}</option>;})}
            </select>
            <select style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:16,outline:"none"}}
              value={mForm.pressingType} onChange={function(e){setMForm(function(x){return {...x,pressingType:e.target.value};});}}>
              <option value="">Pressing Type</option>
              {["Original","Original US","Original UK","Original EU","Original JP","Reissue","Reissue US","Reissue UK","180g Reissue","Anniversary Edition","Limited Edition","Promo","Test Pressing"].map(function(v){return <option key={v}>{v}</option>;})}
            </select>
            <div style={{display:"flex",gap:8}}>
              <button className="btn ghost" style={{flex:1}} onClick={function(){setMModal(null);setMForm({artist:"",album:"",year:"",format:"LP",pressingType:"",notes:""});setMArtistSugs([]);setMAlbumSugs([]);}}>Cancel</button>
              <button className="btn pri" style={{flex:1}} onClick={function(){
                if(!mForm.artist.trim()||!mForm.album.trim()){alert("Artist + Album required");return;}
                mRequireAuth(function(){
                  setCol(function(prev){return [...prev,{id:Date.now(),artist:mForm.artist.trim(),album:mForm.album.trim(),year:mForm.year,format:mForm.format,pressingType:mForm.pressingType,label:"",genre:"",pressing:"",notes:mForm.notes,added:new Date().toISOString()}];});
                  showToast("Record added");
                  setMModal(null);
                  setMForm({artist:"",album:"",year:"",format:"LP",pressingType:"",notes:""});
                  setMArtistSugs([]);setMAlbumSugs([]);
                });
              }}>Add Record</button>
            </div>
          </div>
        </div>
      )}

      {/* Add Wish Modal */}
      {mModal==="add-wish" && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"var(--bg2)",borderRadius:"12px 12px 0 0",padding:"20px 16px",width:"100%",maxHeight:"80vh",overflowY:"auto",boxSizing:"border-box"}}>
            <div style={{fontFamily:"var(--serif)",color:"var(--acc)",fontSize:18,marginBottom:16}}>Add to Watchlist</div>
            <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:10,outline:"none",boxSizing:"border-box"}}
              placeholder="Artist *" value={mForm.artist}
              onChange={function(e){onMArtistChange(e.target.value);}}/>
            <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:10,outline:"none",boxSizing:"border-box"}}
              placeholder="Album *" value={mForm.album}
              onChange={function(e){setMForm(function(x){return {...x,album:e.target.value};});}}/>
            <input style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:16,outline:"none",boxSizing:"border-box"}}
              placeholder="Alert under $ (optional)" value={mForm.notes}
              onChange={function(e){setMForm(function(x){return {...x,notes:e.target.value};});}}/>
            <div style={{display:"flex",gap:8}}>
              <button className="btn ghost" style={{flex:1}} onClick={function(){setMModal(null);setMForm({artist:"",album:"",year:"",format:"LP",pressingType:"",notes:""});}}>Cancel</button>
              <button className="btn pri" style={{flex:1}} onClick={function(){
                if(!mForm.artist.trim()||!mForm.album.trim()){alert("Artist + Album required");return;}
                mRequireAuth(function(){
                  setWish(function(prev){return [...prev,{id:Date.now(),artist:mForm.artist.trim(),album:mForm.album.trim(),notes:mForm.notes,alertUnder:mForm.notes?parseFloat(mForm.notes):null,priority:"medium",added:new Date().toISOString()}];});
                  showToast("Added to watchlist");
                  setMModal(null);
                  setMForm({artist:"",album:"",year:"",format:"LP",pressingType:"",notes:""});
                });
              }}>Save</button>
            </div>
          </div>
        </div>
      )}

      {/* Auth Modal */}
      {mAuthModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"var(--bg2)",borderRadius:8,padding:"24px 20px",width:"100%",maxWidth:340}}>
            <div style={{fontFamily:"var(--serif)",color:"var(--acc)",fontSize:18,marginBottom:8}}>Password Required</div>
            <input type="password" placeholder="Password" value={mAuthInput}
              style={{background:"var(--input)",border:"1px solid var(--bdr)",borderRadius:3,color:"var(--fg)",fontFamily:"var(--mono)",fontSize:14,padding:"12px",width:"100%",marginBottom:8,outline:"none",boxSizing:"border-box"}}
              onChange={function(e){setMAuthInput(e.target.value);}}
              onKeyDown={function(e){if(e.key==="Enter")mSubmitAuth();}}
              ref={function(el){if(el)el.focus();}}/>
            {mAuthError&&<div style={{color:"var(--red)",fontSize:11,marginBottom:8}}>{mAuthError}</div>}
            <div style={{display:"flex",gap:8}}>
              <button className="btn ghost" style={{flex:1}} onClick={function(){setMAuthModal(false);}}>Cancel</button>
              <button className="btn pri" style={{flex:1}} onClick={mSubmitAuth}>Unlock</button>
            </div>
          </div>
        </div>
      )}

      <div style={{position:"fixed",bottom:72,left:"50%",transform:"translateX(-50%)",background:"var(--card)",border:"1px solid var(--acc)",borderRadius:4,color:"var(--acc)",fontSize:11,padding:"8px 14px",opacity:toast.on?1:0,transition:"opacity .25s",pointerEvents:"none",whiteSpace:"nowrap",zIndex:300}}>
        {toast.msg}
      </div>
    </div>
  );
}


function AppEntry() {
  function checkMobile() {
    var w = window.innerWidth;
    var ua = navigator.userAgent||"";
    var isTouchDevice = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    return w <= 900 || isTouchDevice;
  }
  const [isMobile, setIsMobile] = useState(checkMobile);
  useEffect(() => {
    const check = () => setIsMobile(checkMobile());
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);
  return isMobile ? React.createElement(MobileApp) : React.createElement(VinylBrain);
}

try {
  console.log("VinylBrain: starting render...");
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(AppEntry));
  console.log("VinylBrain: render called");
} catch(e) {
  console.error("VinylBrain render error:", e);
  document.getElementById("root").innerHTML = '<div style="color:red;padding:20px"><h2>Error</h2><pre>' + e.message + '</pre></div>';
}

</script></body></html>
