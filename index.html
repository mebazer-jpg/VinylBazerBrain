<!-- Inline manifest for single-file use -->
<script>
// Register service worker for offline use
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    // Inline SW via blob so no separate file needed
    const swCode = `
self.addEventListener("install", e => { self.skipWaiting(); });
self.addEventListener("activate", e => { e.waitUntil(clients.claim()); });
self.addEventListener("fetch", e => {
  if (e.request.url.includes("api.anthropic.com")) return;
  e.respondWith(
    caches.open("vinylbrain-v1").then(cache =>
      cache.match(e.request).then(r => r || fetch(e.request).then(res => {
        if (res.ok && e.request.method === "GET") cache.put(e.request, res.clone());
        return res;
      }).catch(() => r))
    )
  );
});`;
    const blob = new Blob([swCode], {type:"application/javascript"});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  });
}
</script>

// ─── Storage: Supabase when configured, localStorage always as cache/fallback ─
const TABLE_MAP = {
  "vb_collection_v1": "collection",

async function sbFetch(path, opts={}) {
  const SUPABASE_URL = getSBUrl();
  const SUPABASE_KEY = getSBKey();
  if (!SUPABASE_URL || !SUPABASE_KEY) return null;
  try {
    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=minimal",
    };
    // Required for DELETE to work on Supabase without RLS
    if (opts.method === "DELETE") headers["Prefer"] = "return=minimal";
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
      ...opts,
      headers,
    });
    // 204 No Content is success for DELETE/POST with return=minimal
    if (res.status === 204 || res.status === 201) return true;
    if (!res.ok) {
      const err = await res.text();
      console.warn("Supabase error:", res.status, err);
      return null;
    }
    const text = await res.text();
    return text ? JSON.parse(text) : true;
  } catch(e) {
    console.warn("Supabase fetch error:", e);
    return null;
  }
}

async function sget(k) {
  const cached = localStorage.getItem(k);
  const localVal = cached ? JSON.parse(cached) : null;
  const table = TABLE_MAP[k];
  if (table && getSBUrl() && getSBKey()) {
    try {
      const rows = await sbFetch(table + "?select=data&order=id");
      if (Array.isArray(rows) && rows.length > 0) {
        const cloudData = rows[0].data || [];
        // Cloud is always authoritative when connected
        localStorage.setItem(k, JSON.stringify(cloudData));
        return cloudData;
      }
      // Cloud empty — if we have local data push it up
      if (localVal && localVal.length > 0) {
        sset(k, localVal);
        return localVal;
      }
      return [];
    } catch(e) {
      console.warn("sget cloud error, using local:", e);
      return localVal || [];
    }
  }
  return localVal || [];
}

async function sset(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  const table = TABLE_MAP[k];
  if (!table || !getSBUrl() || !getSBKey()) return;
  try {
    const arr = Array.isArray(v) ? v : [];
    // Upsert: update if exists, insert if not
    const row = { id: 1, data: arr };
    const result = await sbFetch(table + "?id=eq.1", {
      method: "PATCH",
      prefer: "return=minimal",
      body: JSON.stringify({ data: arr }),
    });
    // If PATCH found nothing (null result), do an INSERT
    if (result === null) {
      await sbFetch(table, {
        method: "POST",
        prefer: "return=minimal",
        body: JSON.stringify(row),
      });
    }
  } catch(e) {
    console.warn("sset error:", e);
  }
}

function getDecade(year) {
  const y = parseInt(year);
  if (y < 1970) return "60s";
  if (y < 1980) return "70s";
  if (y < 1990) return "80s";
  if (y < 2000) return "90s";
  if (y < 2010) return "00s";
  if (y < 2020) return "10s";
  return "20s";
}

// ─── AI helper ────────────────────────────────────────────────────────────────
async function askClaude(messages, systemCtx) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: systemCtx,
      messages,
    }),
  });
  const data = await res.json();
  return data.content?.find(b => b.type === "text")?.text ?? "Sorry, I couldn't get a response.";
}

.msg.assistant .msg-bubble{background:var(--s2);border:1px solid var(--bdr);color:var(--txt)}
.msg.user .msg-bubble{background:var(--acc2);border:1px solid var(--acc);color:#f5e8c8}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:12px;margin-top:2px}
.msg.assistant .msg-avatar{background:var(--s3);border:1px solid var(--bdr);color:var(--acc)}
.msg.user .msg-avatar{background:var(--acc2);border:1px solid var(--acc);color:#f5e8c8}
.chat-input-row{padding:16px 32px;border-top:1px solid var(--bdr);display:flex;gap:10px;flex-shrink:0}
.chat-input-row textarea{border-radius:4px;font-size:12px;min-height:42px;max-height:120px;resize:none}
.chat-input-row textarea:focus{border-color:var(--acc2)}
.thinking{display:flex;gap:4px;align-items:center;padding:14px 15px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc2);animation:pulse 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chat-suggestions{display:flex;gap:7px;flex-wrap:wrap;padding:0 32px 12px}
.sug-chip{background:none;border:1px solid var(--bdr);border-radius:14px;color:var(--mut);
  cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;
  text-align:left;transition:all .18s}
.sug-chip:hover{border-color:var(--acc2);color:var(--acc)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:center;justify-content:center}
.modal{background:var(--s1);border:1px solid var(--bdr);border-radius:6px;
  padding:24px;max-width:560px;width:90%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:'DM Serif Display',serif;font-size:19px;color:var(--acc);margin-bottom:18px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* autocomplete */
.ac-drop{position:absolute;top:100%;left:0;right:0;background:var(--s3);border:1px solid var(--bdr2);
  border-radius:0 0 4px 4px;z-index:50;max-height:200px;overflow-y:auto;margin-top:-1px}
.ac-item{padding:8px 11px;cursor:pointer;font-size:12px;color:var(--txt);border-bottom:1px solid var(--bdr);transition:background .12s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--s2);color:var(--acc)}
.press-item{display:flex;align-items:center}

/* toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--s2);border:1px solid var(--acc2);
  border-radius:4px;color:var(--acc);font-size:10px;letter-spacing:1px;padding:9px 14px;
  text-transform:uppercase;pointer-events:none;transition:all .25s;z-index:200}

hr.divider{border:none;border-top:1px solid var(--bdr);margin:22px 0}
.empty{color:var(--mut);font-size:12px;padding:30px 0;text-align:center}
.section-label{font-size:9px;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-bottom:12px}
`;

// ─── main component ───────────────────────────────────────────────────────────
function VinylBrain() {
  const [col, setCol]   = useState([]);
  const [wish, setWish] = useState([]);
  const [up, setUp]     = useState([]);
  const [chatLog, setChatLog] = useState([]);
  const [loaded, setLoaded]   = useState(false);

  // Wire hidden file input to our handler (needed for mobile Safari)
  const handleImportFileRef = useRef(null);
  useEffect(() => {
    handleImportFileRef.current = handleImportFile;
  });
  useEffect(() => {
    const el = document.getElementById("vb-import-input");
    if (el) el.onchange = (e) => handleImportFileRef.current && handleImportFileRef.current(e);
  }, []);
  const [tab, setTab]   = useState("collection");
  const [modal, setModal] = useState(null); // "add-record" | "add-wish" | "add-up" | {type:"add-to-wish",album,artist}
  const [toast, setToast] = useState({ msg:"", on:false });
  const [chatInput, setChatInput] = useState("");
  const [thinking, setThinking]   = useState(false);

  // ── Gap Analysis recs — lifted here so they survive tab switches / re-renders ──
  const [gapRecs, setGapRecs]     = useState(null);
  const [gapRecsKey, setGapRecsKey] = useState(0);
  const [authModal, setAuthModal] = useState(false);
  const [authInput, setAuthInput] = useState("");
  const [authError, setAuthError] = useState("");
  const [authCallback, setAuthCallback] = useState(null);

  function requireAuth(cb) {
    if (isAdmin()) { cb(); return; }
    setAuthInput(""); setAuthError(""); 
    setAuthCallback(()=>cb);
    setAuthModal(true);
  }
  function submitAuth() {
    if (authInput === ADMIN_PW) {
      sessionStorage.setItem("vb_auth","ok");
      setAuthModal(false);
      if (authCallback) authCallback();
    } else {
      setAuthError("Incorrect password");
      setAuthInput("");
    }
  }
  const [isMobile, setIsMobile] = useState(false);
  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth <= 700);
    check();
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);

  // Expose tab setter for mobile nav
  useEffect(() => {
    window.__vbSetTab = (t) => setTab(t);
    // Sync active state when tab changes
    var btns = document.querySelectorAll('.vb-mn-btn');
    var tabs = ['collection','watchlist','gaps','upcoming','chat','settings'];
    btns.forEach(function(b, i) {
      b.className = 'vb-mn-btn' + (tabs[i] === tab ? ' on' : '');
    });
  }, [tab]);

  // collection filters
  const [q, setQ] = useState("");
  const [fGenre, setFGenre] = useState("");
  const [fDecade, setFDecade] = useState("");
  const [sortBy, setSortBy] = useState("artist");

  const chatEndRef = useRef(null);

  // ── load ──
  useEffect(() => {
    (async () => {
      const c = await sget(K.COL);  if (c) setCol(c);
      let w   = await sget(K.WISH);
      if (!w) { w = SEED_WISH; await sset(K.WISH, w); }
      setWish(w);
      const u = await sget(K.UP);   if (u) setUp(u);
      const ch = await sget(K.CHAT); if (ch) setChatLog(ch);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { 
    if (loaded) {
      sset(K.COL, col).then(()=>{
        // verify write happened
      });
    }
  }, [col, loaded]);
  useEffect(() => { if (loaded) sset(K.WISH, wish); }, [wish, loaded]);
  useEffect(() => { if (loaded) sset(K.UP,   up);   }, [up,   loaded]);
  useEffect(() => { if (loaded) sset(K.CHAT, chatLog.slice(-60)); }, [chatLog, loaded]);
  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior:"smooth" }); }, [chatLog, thinking]);

  // ── helpers ──
  const showToast = (msg) => {
    setToast({ msg, on:true });
    setTimeout(() => setToast(t => ({...t,on:false})), 2200);
  };

  const genres = [...new Set(col.map(r=>r.genre).filter(Boolean))].sort();
  const totalPaid = col.reduce((s,r) => s+(parseFloat(r.paid)||0), 0);

  const filtered = col.filter(r => {
    const txt = `${r.artist} ${r.album} ${r.label} ${r.notes}`.toLowerCase();
    if (q && !txt.includes(q.toLowerCase())) return false;
    if (fGenre && r.genre !== fGenre) return false;
    if (fDecade && r.year && getDecade(r.year) !== fDecade) return false;
    return true;
  }).sort((a,b) => {
    if (sortBy==="artist") return (a.artist||"").localeCompare(b.artist||"");
    if (sortBy==="album")  return (a.album||"").localeCompare(b.album||"");
    if (sortBy==="year")   return (parseInt(a.year)||0)-(parseInt(b.year)||0);
    if (sortBy==="paid")   return (parseFloat(b.paid)||0)-(parseFloat(a.paid)||0);
    if (sortBy==="added")  return new Date(b.added)-new Date(a.added);
    return 0;
  });

  // ── collection ops ──
  function addRecord(form) {
    requireAuth(() => { setCol(prev => [...prev, { ...form, id:Date.now(), added:new Date().toISOString() }]); setModal(null); showToast("Record added to collection"); });
  }
  function removeRecord(id) {
    requireAuth(() => { if (!window.confirm("Remove this record?")) return; setCol(prev => prev.filter(r=>r.id!==id)); showToast("Record removed"); });
  }

  function exportCollection() {
    const payload = { col, wish, up, exportedAt: new Date().toISOString(), version: 1 };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "vinylbrain-export.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("Downloading vinylbrain-export.json");
  }

  function importCollection() {
    // Use the persistent hidden file input in the DOM (works on mobile Safari)
    const input = document.getElementById("vb-import-input");
    if (input) { input.value = ""; input.click(); }
  }

  function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.col) { alert("Invalid VinylBrain export file."); return; }
        const confirmMsg = `Import ${data.col.length} records, ${(data.wish||[]).length} watchlist items, and ${(data.up||[]).length} upcoming releases?\n\nThis will REPLACE your current data.`;
        if (!window.confirm(confirmMsg)) return;
        setCol(data.col || []);
        setWish(data.wish || []);
        setUp(data.up || []);
        showToast(`Imported ${data.col.length} records`);
      } catch { alert("Couldn\'t read file — make sure it\'s a VinylBrain export."); }
    };
    reader.readAsText(file);
  }

  function editRecord(updated) {
    requireAuth(() => { setCol(prev => prev.map(r => r.id === updated.id ? updated : r)); setModal(null); showToast("Record updated"); });
  }

  // ── wishlist ops ──
  function addWish(form) {
    requireAuth(() => { setWish(prev => [...prev, { ...form, id:Date.now(), alertUnder:form.alertUnder?parseFloat(form.alertUnder):null, added:new Date().toISOString() }]); setModal(null); showToast("Added to watchlist"); });
  }
  function removeWish(id) {
    requireAuth(() => { if (!window.confirm("Remove from watchlist?")) return; setWish(prev => prev.filter(w=>w.id!==id)); showToast("Removed"); });
  }
  function addGapToWish(artist, album) {
    if (wish.find(w=>w.artist===artist&&w.album===album)) { showToast("Already on watchlist"); return; }
    setWish(prev => [...prev, { id:Date.now(), artist, album, notes:"", alertUnder:null, priority:"medium", added:new Date().toISOString() }]);
    showToast(`Added "${album}" to watchlist`);
  }

  // ── upcoming ops ──
  function addUpcoming(form) {
    setUp(prev => [...prev, { ...form, id:Date.now(), added:new Date().toISOString() }]);
    setModal(null); showToast("Release tracked");
  }
  function removeUp(id) {
    if (!window.confirm("Remove?")) return;
    setUp(prev => prev.filter(u=>u.id!==id));
    showToast("Removed");
  }

  // ── chat ──
  const SYSTEM = () => `You are a knowledgeable vinyl record assistant embedded in a personal collection tracker called Vinyl Brain.

The user's collection (${col.length} records):
${col.map(r=>`- ${r.artist} — ${r.album}${r.year?" ("+r.year+")":""}${r.genre?" ["+r.genre+"]":""}`).join("\n") || "(empty so far)"}

Their watchlist:
${wish.map(w=>`- ${w.artist} — ${w.album}${w.alertUnder?" (alert under $"+w.alertUnder+")":""} [priority: ${w.priority||"?"}]`).join("\n") || "(empty)"}

Upcoming releases tracked:
${up.map(u=>`- ${u.artist} — ${u.album} (${u.date||"TBD"})`).join("\n") || "(none)"}

You help the user:
- Understand gaps and patterns in their collection
- Get recommendations for what to hunt for next
- Learn about pressing details, label history, and record values
- Think about upcoming reissues or new releases worth tracking
- Answer any question about the records they own or want

Be conversational, warm, and specific. You love records. Keep responses concise — 2-4 short paragraphs max unless they ask for a list. Reference their actual collection when relevant.`;

  async function sendChat(text) {
    const msg = text.trim();
    if (!msg) return;
    const userMsg = { role:"user", content:msg };
    const newLog = [...chatLog, userMsg];
    setChatLog(newLog);
    setChatInput("");
    setThinking(true);
    try {
      const reply = await askClaude(
        newLog.map(m=>({ role:m.role, content:m.content })),
        SYSTEM()
      );
      setChatLog(prev => [...prev, { role:"assistant", content:reply }]);
    } catch {
      setChatLog(prev => [...prev, { role:"assistant", content:"Something went wrong — try again." }]);
    }
    setThinking(false);
  }

  const SUGGESTIONS = [
    "What are the biggest gaps in my collection?",
    "Recommend something based on what I own",
    "What should I hunt for next under $40?",
    "Any Los Lobos deep cuts I'd like?",
    "What decade am I missing most?",
  ];

  // ─── render helpers ────────────────────────────────────────────────────────
  function SettingsPanel() {
    const [url,  setUrl]  = useState(localStorage.getItem("sb_url")  || "");
    const [key,  setKey]  = useState(localStorage.getItem("sb_key")  || "");
    const [status, setStatus] = useState("");
    const connected = !!(localStorage.getItem("sb_url") && localStorage.getItem("sb_key"));

    async function testAndSave() {
      if (!url.trim() || !key.trim()) { setStatus("Paste both values first."); return; }
      setStatus("Testing connection…");
      try {
        const res = await fetch(url.trim() + "/rest/v1/collection?select=id&limit=1", {
          headers: { "apikey": key.trim(), "Authorization": "Bearer " + key.trim() }
        });
        if (res.ok || res.status === 406) {
          localStorage.setItem("sb_url", url.trim());
          localStorage.setItem("sb_key", key.trim());
          setStatus("✓ Connected! Reloading…");
          setTimeout(() => location.reload(), 1200);
        } else {
          setStatus("Connection failed (status " + res.status + "). Check your URL and key.");
        }
      } catch(e) {
        setStatus("Connection failed: " + e.message);
      }
    }

    function disconnect() {
      if (!window.confirm("Disconnect Supabase? Your local data stays but cloud sync will stop.")) return;
      localStorage.removeItem("sb_url");
      localStorage.removeItem("sb_key");
      location.reload();
    }

    return (
      <div style={{maxWidth:560}}>
        <div className="card" style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:connected?"var(--grn)":"var(--mut)",flexShrink:0}}/>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,color:"var(--txt)"}}>
              Cloud Sync {connected ? "— Connected" : "— Not configured"}
            </div>
          </div>
          <div style={{color:"var(--mut)",fontSize:12,lineHeight:1.7,marginBottom:16}}>
            {connected
              ? "Your collection syncs automatically between all devices. Add records on your phone in a store and they'll appear on your laptop instantly."
              : "Connect Supabase to sync your collection across your phone and laptop. Free account at supabase.com — takes 5 minutes to set up."}
          </div>
          {!connected && (
            <div style={{background:"var(--s2)",border:"1px solid var(--bdr)",borderRadius:4,padding:14,marginBottom:14,fontSize:11,color:"var(--mut)",lineHeight:1.8}}>
              <strong style={{color:"var(--acc)"}}>Setup:</strong> Go to supabase.com → New Project → SQL Editor → run:<br/>
              <code style={{color:"var(--acc3)",fontSize:10}}>
                create table collection (id bigint primary key, data jsonb);<br/>
                create table wishlist (id bigint primary key, data jsonb);<br/>
                create table upcoming (id bigint primary key, data jsonb);
              </code><br/>
              Then go to Settings → API and copy your Project URL and anon key below.
            </div>
          )}
          <div className="form-grid" style={{marginBottom:12}}>
            <div className="field full">
              <label>Supabase Project URL</label>
              <input type="text" placeholder="https://xxxx.supabase.co" value={url} onChange={e=>setUrl(e.target.value)}/>
            </div>
            <div className="field full">
              <label>Supabase Anon Key</label>
              <input type="text" placeholder="eyJhbGciOiJIUzI1NiIs..." value={key} onChange={e=>setKey(e.target.value)}/>
            </div>
          </div>
          {status && <div style={{fontSize:11,color:status.startsWith("✓")?"var(--grn)":"var(--med)",marginBottom:10}}>{status}</div>}
          <div style={{display:"flex",gap:8}}>
            <button className="btn pri" onClick={testAndSave}>
              {connected ? "Update Connection" : "Connect & Sync"}
            </button>
            {connected && <button className="btn danger" onClick={disconnect}>Disconnect</button>}
          </div>
        </div>

        <div className="card">
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:16,color:"var(--txt)",marginBottom:12}}>Backup & Restore</div>
          <div style={{color:"var(--mut)",fontSize:12,marginBottom:14}}>Export your collection as a JSON file for safekeeping, or import a previous backup.</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn ghost" onClick={exportCollection}>↓ Export Backup</button>
            <button className="btn ghost" onClick={importCollection}>↑ Import Backup</button>
          </div>
        </div>
      </div>
    );
  }

  function GapAnalysis() {
    const artistsInCol = [...new Set(col.map(r=>r.artist))];
    // All artists with discographies — those in collection AND any user has browsed
    const [browsedArtists, setBrowsedArtists] = useState([]);
    const [artistSearch, setArtistSearch] = useState("");
    const [showArtistPicker, setShowArtistPicker] = useState(false);

    // Artists shown in gap analysis = in collection + manually browsed
    const activeArtists = [...new Set([
      ...Object.keys(DISCOGRAPHIES).filter(a => artistsInCol.includes(a)),
      ...browsedArtists,
    ])];

    // Artist picker suggestions
    const allDiscoArtists = Object.keys(DISCOGRAPHIES).sort();
    const pickerSugs = artistSearch.length > 0
      ? allDiscoArtists.filter(a => a.toLowerCase().includes(artistSearch.toLowerCase()) && !activeArtists.includes(a)).slice(0, 12)
      : allDiscoArtists.filter(a => !activeArtists.includes(a)).slice(0, 16);

    const genreMap = {}, decadeMap = {};
    col.forEach(r => {
      if (r.genre) genreMap[r.genre] = (genreMap[r.genre]||0)+1;
      if (r.year) { const d=getDecade(r.year); decadeMap[d]=(decadeMap[d]||0)+1; }
    });
    const topG = Object.entries(genreMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const maxG = topG[0]?.[1]||1;
    const decades = ["60s","70s","80s","90s","00s","10s","20s"];
    const maxD = Math.max(...decades.map(d=>decadeMap[d]||0),1);

    // AI recommendations — state lives in parent to survive re-renders
    const recs = gapRecs;
    const setRecs = setGapRecs;
    const recsKey = gapRecsKey;

    useEffect(() => {
      if (col.length === 0) return;
      if (recs !== null) return; // don't auto-fire if we already have results
      setRecs("loading");
      const colSummary = col.slice(0,40).map(r=>`${r.artist} — ${r.album}${r.genre?" ["+r.genre+"]":""}`).join(", ");
      const wishSummary = wish.slice(0,10).map(w=>`${w.artist} — ${w.album}`).join(", ");
      fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:800,
          system:`You are a vinyl record curator. Based on a listener's collection, recommend records they'd love but don't own. Return ONLY a JSON array of exactly 10 objects, no markdown:
[{"artist":"X","album":"Y","year":"1975","genre":"Rock","why":"one sentence reason connecting to their taste"}]
Be specific and personal — reference actual things in their collection. Vary genres and eras. Include some deep cuts, not just obvious classics.`,
          messages:[{role:"user",content:`My collection: ${colSummary}
My watchlist: ${wishSummary}
Recommend 10 records I'd love that I don't already own.`}]
        })
      })
      .then(r=>r.json())
      .then(d=>{
        const text = (d.content?.[0]?.text||"[]").replace(/```json|```/g,"").trim();
        setRecs(JSON.parse(text));
      })
      .catch(()=>setRecs([]));
    }, [recsKey]);

    // Quick-add — does NOT close/re-render the list
    function quickAddToCollection(artist, album) {
      if (col.some(r=>r.artist===artist&&r.album===album)) { showToast("Already in collection"); return; }
      const meta = ALBUM_META[artist]?.[album] || {};
      setCol(prev => [...prev, { id:Date.now(), artist, album, year:meta.year||"", label:meta.label||"", genre:meta.genre||"", format:"LP", pressing:"", notes:"", added:new Date().toISOString() }]);
      showToast(`✓ Added "${album}" to collection`);
    }

    function quickAddToWish(artist, album) {
      if (wish.some(w=>w.artist===artist&&w.album===album)) { showToast("Already on watchlist"); return; }
      setWish(prev => [...prev, { id:Date.now(), artist, album, notes:"", alertUnder:null, priority:"medium", added:new Date().toISOString() }]);
      showToast(`✓ "${album}" added to watchlist`);
    }

    return (
      <div>
        {/* Charts */}
        <div className="card-grid" style={{marginBottom:20}}>
          <div className="card">
            <div className="section-label">By Genre</div>
            {topG.length ? topG.map(([g,n])=>(
              <div className="bar-row" key={g}>
                <div className="bar-label">{g}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:`${Math.round(n/maxG*100)}%`}}></div></div>
                <div className="bar-count">{n}</div>
              </div>
            )) : <div className="empty" style={{padding:"8px 0",textAlign:"left"}}>Add records with genres first.</div>}
          </div>
          <div className="card">
            <div className="section-label">By Decade</div>
            {decades.map(d=>(
              <div className="bar-row" key={d}>
                <div className="bar-label">{d}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:`${Math.round((decadeMap[d]||0)/maxD*100)}%`}}></div></div>
                <div className="bar-count">{decadeMap[d]||0}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Browse more artists */}
        <div style={{marginBottom:20,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{color:"var(--mut)",fontSize:11}}>Showing {activeArtists.length} artist{activeArtists.length!==1?"s":""} ·</div>
          <button className="btn ghost" style={{fontSize:10,padding:"4px 12px",borderColor:"var(--acc2)",color:"var(--acc)"}}
            onClick={()=>setShowArtistPicker(v=>!v)}>

    // ─── modals ───────────────────────────────────────────────────────────────
  function AddRecordModal() {
    const [f, setF] = useState({ artist:"", album:"", year:"", label:"", genre:"", format:"LP", pressingType:"", pressing:"", notes:"" });
    const [artistSugs, setArtistSugs] = useState([]);
    const [albumSugs,  setAlbumSugs]  = useState([]);
    const [genreSugs,  setGenreSugs]  = useState([]);
    const albumRef = useRef(null);
    const genreRef = useRef(null);

    const allKnownArtists = [...new Set([...ALL_ARTISTS, ...col.map(r => r.artist).filter(Boolean)])].sort();

    // ── Artist ──
    function onArtistChange(v) {
      setF(x => ({ ...x, artist:v, album:"", year:"", label:"", genre:"", pressing:"" }));
      setAlbumSugs([]);
      if (!v.trim()) { setArtistSugs([]); return; }
      const vl = v.toLowerCase();
      const starts   = allKnownArtists.filter(a => a && a.toLowerCase().startsWith(vl));
      const contains = allKnownArtists.filter(a => a && !a.toLowerCase().startsWith(vl) && a.toLowerCase().includes(vl));
      setArtistSugs([...starts, ...contains].slice(0, 8));
    }

    function pickArtist(a) {
      setF(x => ({ ...x, artist:a }));
      setArtistSugs([]);
      const albums = [...new Set([...(DISCOGRAPHIES[a]||[]), ...col.filter(r=>r.artist===a).map(r=>r.album)])];
      setAlbumSugs(albums.slice(0, 10));
      setTimeout(() => albumRef.current?.focus(), 50);
    }

    // ── Album ──
    function onAlbumChange(v) {
      setF(x => ({ ...x, album:v, year:"", label:"", genre:"", pressing:"" }));
      if (!v.trim()) { setAlbumSugs([]); return; }
      const knownAlbums = [...new Set([...(DISCOGRAPHIES[f.artist]||[]), ...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
      const vl = v.toLowerCase();
      const starts   = knownAlbums.filter(a => a.toLowerCase().startsWith(vl));
      const contains = knownAlbums.filter(a => !a.toLowerCase().startsWith(vl) && a.toLowerCase().includes(vl));
      setAlbumSugs([...new Set([...starts,...contains])].slice(0, 8));
    }

    function pickAlbum(a) {
      const meta = ALBUM_META[f.artist]?.[a] || {};
      const yearFallback = ALBUM_YEARS[f.artist]?.[a] || "";
      setF(x => ({
        ...x, album:a,
        year:  x.year  || meta.year  || yearFallback,
        label: x.label || meta.label || "",
        genre: x.genre || meta.genre || "",
      }));
      setAlbumSugs([]);
      setTimeout(() => genreRef.current?.focus(), 50);
    }

    function onAlbumFocus() {
      if (!f.album && f.artist) {
        const albums = [...new Set([...(DISCOGRAPHIES[f.artist]||[]), ...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
        if (albums.length) setAlbumSugs(albums.slice(0, 10));
      }
    }

    // ── Genre ──
    function onGenreChange(v) {
      setF(x => ({ ...x, genre:v }));
      if (!v.trim()) { setGenreSugs([]); return; }
      const vl = v.toLowerCase();
      // also include genres from user's own collection
      const userGenres = [...new Set(col.map(r=>r.genre).filter(Boolean))];
      const allGenres  = [...new Set([...GENRES, ...userGenres])].sort();
      const starts   = allGenres.filter(g => g.toLowerCase().startsWith(vl));
      const contains = allGenres.filter(g => !g.toLowerCase().startsWith(vl) && g.toLowerCase().includes(vl));
      setGenreSugs([...starts,...contains].slice(0, 6));
    }

    function pickGenre(g) { setF(x=>({...x,genre:g})); setGenreSugs([]); }

    // ── highlight match ──
    function highlight(str, query) {
      if (!query) return str;
      const idx = str.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return str;
      return <>{str.slice(0,idx)}<strong style={{color:"var(--acc)"}}>{str.slice(idx,idx+query.length)}</strong>{str.slice(idx+query.length)}</>;
    }

    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setModal(null)}>
        <div className="modal" style={{maxWidth:620}}>
          <h3>Add to Collection</h3>
          <div className="form-grid">

            {/* Artist */}
            <div className="field" style={{position:"relative"}}>
              <label>Artist *</label>
              <input type="text" placeholder="Start typing…" value={f.artist} autoFocus
                onChange={e=>onArtistChange(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&artistSugs.length){pickArtist(artistSugs[0]);e.preventDefault();}if(e.key==="Escape")setArtistSugs([]);}}
                onBlur={()=>setTimeout(()=>setArtistSugs([]),200)}
              />
              {artistSugs.length>0&&<div className="ac-drop">{artistSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickArtist(a)}>{highlight(a,f.artist)}</div>)}</div>}
            </div>

            {/* Album */}
            <div className="field" style={{position:"relative"}}>
              <label>Album *
                {f.artist&&DISCOGRAPHIES[f.artist]&&<span style={{color:"var(--mut)",fontSize:9,marginLeft:6}}>{DISCOGRAPHIES[f.artist].length} known</span>}
              </label>
              <input ref={albumRef} type="text" placeholder={f.artist?"Start typing or click to see all…":"Pick artist first"} value={f.album}
                disabled={!f.artist}
                onChange={e=>onAlbumChange(e.target.value)}
                onFocus={onAlbumFocus}
                onKeyDown={e=>{if(e.key==="Enter"&&albumSugs.length){pickAlbum(albumSugs[0]);e.preventDefault();}if(e.key==="Escape")setAlbumSugs([]);}}
                onBlur={()=>setTimeout(()=>setAlbumSugs([]),200)}
              />
              {albumSugs.length>0&&<div className="ac-drop">{albumSugs.map(a=><div key={a} className="ac-item" onMouseDown={()=>pickAlbum(a)}>{highlight(a,f.album)}</div>)}</div>}
            </div>

            {/* Year — auto-filled from ALBUM_META */}
            <div className="field">
              <label>Year
                {f.year&&ALBUM_META[f.artist]?.[f.album]?.year===f.year&&<span style={{color:"var(--grn)",fontSize:9,marginLeft:6}}>✓ auto-filled</span>}
              </label>
              <input type="text" placeholder="e.g. 1984" value={f.year} onChange={e=>setF(x=>({...x,year:e.target.value}))} />
            </div>

            {/* Label — auto-filled */}
            <div className="field">
              <label>Label
                {f.label&&ALBUM_META[f.artist]?.[f.album]?.label===f.label&&<span style={{color:"var(--grn)",fontSize:9,marginLeft:6}}>✓ auto-filled</span>}
              </label>
              <input type="text" placeholder="e.g. Columbia" value={f.label} onChange={e=>setF(x=>({...x,label:e.target.value}))} />
            </div>

            {/* Genre — autocomplete from canonical list */}
            <div className="field" style={{position:"relative"}}>
              <label>Genre
                {f.genre&&ALBUM_META[f.artist]?.[f.album]?.genre===f.genre&&<span style={{color:"var(--grn)",fontSize:9,marginLeft:6}}>✓ auto-filled</span>}
              </label>
              <input ref={genreRef} type="text" placeholder="Start typing…" value={f.genre}
                onChange={e=>onGenreChange(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&genreSugs.length){pickGenre(genreSugs[0]);e.preventDefault();}if(e.key==="Escape")setGenreSugs([]);}}
                onBlur={()=>setTimeout(()=>setGenreSugs([]),200)}
              />
              {genreSugs.length>0&&<div className="ac-drop">{genreSugs.map(g=><div key={g} className="ac-item" onMouseDown={()=>pickGenre(g)}>{highlight(g,f.genre)}</div>)}</div>}
            </div>

            {/* Format */}
            <div className="field">
              <label>Format</label>
              <select value={f.format} onChange={e=>setF(x=>({...x,format:e.target.value}))}>
                {["LP","2xLP","3xLP","EP","12\" Single","10\" Single","7\" Single","Box Set","Picture Disc","Colored Vinyl","Test Pressing"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>

            {/* Pressing Type */}
            <div className="field">
              <label>Pressing Type</label>
              <select value={f.pressingType||""} onChange={e=>setF(x=>({...x,pressingType:e.target.value}))}>
                <option value="">— select —</option>
                <option>Original</option>
                <option>Original US</option>
                <option>Original UK</option>
                <option>Original EU</option>
                <option>Original JP</option>
                <option>Original AU</option>
                <option>Original CA</option>
                <option>Reissue</option>
                <option>Reissue US</option>
                <option>Reissue UK</option>
                <option>Reissue EU</option>
                <option>Reissue JP</option>
                <option>Repress</option>
                <option>180g Reissue</option>
                <option>Anniversary Edition</option>
                <option>Deluxe Edition</option>
                <option>Limited Edition</option>
                <option>Promo Copy</option>
                <option>Test Pressing</option>
                <option>Bootleg</option>
              </select>
            </div>

            {/* Pressing Details */}
            <div className="field">
              <label>Pressing Details</label>
              <input type="text" placeholder="e.g. Columbia · 1984 · gatefold" value={f.pressing} onChange={e=>setF(x=>({...x,pressing:e.target.value}))} />
            </div>

            {/* Notes */}
            <div className="field full">
              <label>Notes</label>
              <input type="text" placeholder="Gatefold, colored vinyl, includes insert…" value={f.notes} onChange={e=>setF(x=>({...x,notes:e.target.value}))} />
            </div>

          </div>
          <div className="modal-footer">
            <button className="btn ghost" onClick={()=>setModal(null)}>Cancel</button>
            <button className="btn pri" onClick={()=>{
              if(!f.artist.trim()||!f.album.trim()){showToast("Artist + Album required");return;}
              addRecord(f);
            }}>Add Record</button>
          </div>
        </div>
      </div>
    );
  }

                <option>Original EU</option><option>Original JP</option><option>Original AU</option>
                <option>Original CA</option><option>Reissue</option><option>Reissue US</option>
                <option>Reissue UK</option><option>Reissue EU</option><option>Reissue JP</option>
                <option>Repress</option><option>180g Reissue</option><option>Anniversary Edition</option>
                <option>Deluxe Edition</option><option>Limited Edition</option>

            </div>
          </div>
        </div>
      </div>
    );
  }

      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>

  function AddUpModal() {

            <div className="nav-section">Discover</div>
            {NAV.slice(2).map(n=>(

            <div className="sm-row"><span className="sm-l">Genres</span><span className="sm-v">{genres.length}</span></div>

                <div className="page-title">My <em>Collection</em></div>

                            onClick={()=>sendChat(`Search for "${w.album}" by ${w.artist} and tell me about current market prices and where to find it.`) || setTab("chat")}>

          {tab==="gaps" && (
            <div className="page">
              <div className="page-hd">

              {up.length===0
                ? <div>
                    <div className="empty">No upcoming releases tracked yet.</div>

                  </div>
                : up.map(u=>{
                    const pts = (u.date||"").split(" ");
                    const artistOwned = col.some(r=>r.artist.toLowerCase()===u.artist.toLowerCase());
                    return (
                      <div className="up-item" key={u.id}>
                        <div className="up-date">
                          <div className="up-mo">{pts[0]||""}</div>
                          <div className="up-day">{pts[1]||"—"}</div>
                        </div>
                        <div className="up-info">
                          <h4>{u.artist}{u.album?` — ${u.album}`:""}</h4>
                          <p>{u.label?u.label+" · ":""}{u.why||""}</p>
                          {artistOwned&&<span className="owned-tag">In collection</span>}
                        </div>
                        <button className="btn danger" style={{fontSize:9,padding:"3px 7px",marginLeft:"auto",flexShrink:0}} onClick={()=>removeUp(u.id)}>✕</button>
                      </div>
                    );
                  })
              }
            </div>
          )}

          {/* SETTINGS */}
          {tab==="settings" && (
            <div className="page">
              <div className="page-hd"><div className="page-title"><em>Settings</em></div></div>
              <SettingsPanel/>
            </div>
          )}

          {/* CHAT */}
          {tab==="chat" && (
            <div className="chat-wrap">
              <div className="chat-hd">
                <h2>Ask the <em style={{color:"var(--acc)"}}>Crate</em></h2>
                <p>Your collection-aware vinyl advisor — knows what you own, what you want, and what you're missing.</p>
              </div>
              <div className="chat-msgs">
                {chatLog.length===0 && (
                  <div className="msg assistant">
                    <div className="msg-avatar">♪</div>
                    <div className="msg-bubble">
                      Hey — I'm the Crate. I know your collection, your watchlist, and what you're hunting. Ask me anything: what to look for next, pressing details, market prices, what's worth tracking down, or just to talk records.
                    </div>
                  </div>
                )}
                {chatLog.map((m,i)=>(
                  <div key={i} className={`msg ${m.role}`}>
                    <div className="msg-avatar">{m.role==="user"?"▲":"♪"}</div>
                    <div className="msg-bubble" style={{whiteSpace:"pre-wrap"}}>{m.content}</div>
                  </div>
                ))}
                {thinking&&(
                  <div className="msg assistant">
                    <div className="msg-avatar">♪</div>
                    <div className="msg-bubble"><div className="thinking"><div className="dot"/><div className="dot"/><div className="dot"/></div></div>
                  </div>
                )}
                <div ref={chatEndRef}/>
              </div>
              {chatLog.length===0&&(
                <div className="chat-suggestions">
                  {SUGGESTIONS.map(s=>(
                    <button key={s} className="sug-chip" onClick={()=>sendChat(s)}>{s}</button>
                  ))}
                </div>
              )}
              <div className="chat-input-row">
                <textarea
                  placeholder="Ask about your collection, pressing details, what to hunt…"
                  value={chatInput}
                  onChange={e=>setChatInput(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendChat(chatInput); } }}
                />
                <button className="btn pri" onClick={()=>sendChat(chatInput)} disabled={thinking} style={{flexShrink:0}}>Send</button>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Modals */}
      {modal==="add-record" && <AddRecordModal/>}
      {modal?.type==="edit-record" && <EditRecordModal record={modal.record}/>}
      {modal==="add-wish"  && <AddWishModal prefill={null}/>}
      {modal==="add-up"    && <AddUpModal/>}
      {modal?.type==="add-to-wish" && <AddWishModal prefill={modal}/>}
      {modal?.type==="export-data" && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal" style={{maxWidth:560}}>
            <h3>Export Your Collection</h3>
            <p style={{color:"var(--mut)",fontSize:12,marginBottom:12}}>Copy everything below and save as <strong style={{color:"var(--acc)"}}>vinylbrain-export.json</strong></p>
            <textarea readOnly value={modal.json} style={{width:"100%",height:200,fontFamily:"monospace",fontSize:11,background:"var(--s2)",border:"1px solid var(--bdr)",color:"var(--mut)",borderRadius:3,padding:10}} onFocus={e=>e.target.select()}/>
            <div className="modal-footer">
              <button className="btn ghost" onClick={()=>setModal(null)}>Close</button>
              <button className="btn pri" onClick={()=>navigator.clipboard.writeText(modal.json).then(()=>showToast("Copied!"))}>Copy</button>
            </div>
          </div>
        </div>
      )}

      {/* Auth Modal */}
      {authModal && (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth:340}}>
            <h3>Password Required</h3>
            <p style={{color:"var(--mut)",fontSize:12,marginBottom:16}}>This collection is password protected.</p>
            <input type="password" placeholder="Password" value={authInput} autoFocus
              style={{width:"100%",marginBottom:8}}
              onChange={e=>setAuthInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&submitAuth()}/>
            {authError&&<div style={{color:"var(--red)",fontSize:11,marginBottom:8}}>{authError}</div>}
            <div className="modal-footer">
              <button className="btn ghost" onClick={()=>setAuthModal(false)}>Cancel</button>
              <button className="btn pri" onClick={submitAuth}>Unlock</button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      <div className="toast" style={{opacity:toast.on?1:0,transform:toast.on?"translateY(0)":"translateY(6px)"}}>{toast.msg}</div>
    </>
  );
}


// ── Mobile wrapper ─────────────────────────────────────────────────────────────
function MobileApp() {
  const [tab, setTab] = useState("collection");
  const [col, setCol] = useState([]);
  const [wish, setWish] = useState([]);
  const [up, setUp] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState({msg:"",on:false});

  useEffect(() => {
    (async () => {
      const c = await sget(K.COL); if (c) setCol(c);
      let w = await sget(K.WISH);
      if (!w || !w.length) { w = SEED_WISH; await sset(K.WISH, w); }
      setWish(w);
      const u = await sget(K.UP); if (u) setUp(u);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) sset(K.COL, col); }, [col, loaded]);
  useEffect(() => { if (loaded) sset(K.WISH, wish); }, [wish, loaded]);
  useEffect(() => { if (loaded) sset(K.UP, up); }, [up, loaded]);

  const showToast = (msg) => {
    setToast({msg, on:true});
    setTimeout(() => setToast(t=>({...t,on:false})), 2200);
  };

  const [mAuthModal, setMAuthModal] = useState(false);
  const [mAuthInput, setMAuthInput] = useState("");
  const [mAuthError, setMAuthError] = useState("");
  const [mAuthCb, setMAuthCb] = useState(null);
  function mRequireAuth(cb) {
    if (isAdmin()) { cb(); return; }
    setMAuthInput(""); setMAuthError("");
    setMAuthCb(()=>cb); setMAuthModal(true);
  }
  function mSubmitAuth() {
    if (mAuthInput === ADMIN_PW) {
      sessionStorage.setItem("vb_auth","ok");
      setMAuthModal(false); if(mAuthCb) mAuthCb();
    } else { setMAuthError("Incorrect password"); setMAuthInput(""); }
  }

  function addRecord(f) {
    mRequireAuth(() => { setCol(prev => [...prev, {...f, id:Date.now(), added:new Date().toISOString()}]); setModal(null); showToast("Record added"); });
  }
  function removeRecord(id) {
    mRequireAuth(() => { if (!window.confirm("Remove?")) return; setCol(prev => prev.filter(r=>r.id!==id)); showToast("Removed"); });
  }
  function addWish(f) {
    mRequireAuth(() => { setWish(prev => [...prev, {...f, id:Date.now(), alertUnder:f.alertUnder?parseFloat(f.alertUnder):null, added:new Date().toISOString()}]); setModal(null); showToast("Added to watchlist"); });
  }
  function removeWish(id) {
    mRequireAuth(() => { if (!window.confirm("Remove?")) return; setWish(prev => prev.filter(w=>w.id!==id)); showToast("Removed"); });
  }

  const TABS = [
    {id:"collection", icon:"◉", label:"Collection"},
    {id:"watchlist",  icon:"◈", label:"Watchlist"},
    {id:"gaps",       icon:"◻", label:"Gaps"},
    {id:"chat",       icon:"◌", label:"Crate"},
    {id:"settings",   icon:"◎", label:"Settings"},
  ];

  const S = {
    wrap: {display:"flex",flexDirection:"column",height:"100dvh",background:"#0e0c0a",color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:13,overflow:"hidden"},
    header: {padding:"14px 16px 10px",borderBottom:"1px solid #2e2a25",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"},
    title: {fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#d4a853",fontStyle:"italic"},
    content: {flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 16px"},
    bottomNav: {flexShrink:0,display:"flex",flexDirection:"row",borderTop:"1px solid #2e2a25",background:"#151310",paddingBottom:"env(safe-area-inset-bottom,0px)"},
    navBtn: {flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,background:"none",border:"none",borderTop:"2px solid transparent",color:"#6b6559",fontSize:9,fontFamily:"sans-serif",padding:"8px 2px 6px",cursor:"pointer"},
    navBtnOn: {flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,background:"none",border:"none",borderTop:"2px solid #c8a96e",color:"#c8a96e",fontSize:9,fontFamily:"sans-serif",padding:"8px 2px 6px",cursor:"pointer"},
    card: {background:"#161616",border:"1px solid #2e2a25",borderRadius:5,padding:"14px 16px",marginBottom:10},
    input: {background:"#1c1917",border:"1px solid #2e2a25",borderRadius:3,color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:10,outline:"none",boxSizing:"border-box"},
    btn: {background:"none",border:"1px solid #2e2a25",borderRadius:3,color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:11,padding:"9px 16px",cursor:"pointer",marginRight:8},
    btnPri: {background:"#8b6914",border:"1px solid #8b6914",borderRadius:3,color:"#f5e8c8",fontFamily:"'DM Mono',monospace",fontSize:11,padding:"9px 16px",cursor:"pointer"},
    label: {color:"#6b6559",fontSize:10,letterSpacing:"1.5px",textTransform:"uppercase",display:"block",marginBottom:4},
    muted: {color:"#6b6559",fontSize:12},
    acc: {color:"#d4a853"},
    row: {display:"flex",gap:8,marginBottom:10},
    select: {background:"#1c1917",border:"1px solid #2e2a25",borderRadius:3,color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:13,padding:"10px 12px",width:"100%",marginBottom:10,outline:"none"},
  };

  // Simple add record form for mobile
  const [f, setF] = useState({artist:"",album:"",year:"",genre:"",label:"",format:"LP",pressingType:"",pressing:"",notes:""});
  const allKnownArtists = [...new Set([...ALL_ARTISTS,...col.map(r=>r.artist).filter(Boolean)])].sort();
  const [artistSugs, setArtistSugs] = useState([]);
  const [albumSugs, setAlbumSugs] = useState([]);

  function onArtistChange(v) {
    setF(x=>({...x,artist:v,album:"",year:"",genre:"",label:""}));
    if (!v) { setArtistSugs([]); return; }
    const vl=v.toLowerCase();
    const s=allKnownArtists.filter(a=>a&&a.toLowerCase().startsWith(vl));
    const c=allKnownArtists.filter(a=>a&&!a.toLowerCase().startsWith(vl)&&a.toLowerCase().includes(vl));
    setArtistSugs([...s,...c].slice(0,6));
  }
  function pickArtist(a) {
    setF(x=>({...x,artist:a}));
    setArtistSugs([]);
    const albums=[...new Set([...(DISCOGRAPHIES[a]||[]),...col.filter(r=>r.artist===a).map(r=>r.album)])];
    setAlbumSugs(albums.slice(0,8));
  }
  function onAlbumChange(v) {
    setF(x=>({...x,album:v,year:"",genre:"",label:""}));
    if (!v) { setAlbumSugs([]); return; }
    const all=[...new Set([...(DISCOGRAPHIES[f.artist]||[]),...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];
    const vl=v.toLowerCase();
    setAlbumSugs(all.filter(a=>a.toLowerCase().includes(vl)).slice(0,6));
  }
  function pickAlbum(a) {
    const meta=ALBUM_META[f.artist]?.[a]||{};
    const yr=ALBUM_YEARS[f.artist]?.[a]||"";
    setF(x=>({...x,album:a,year:x.year||meta.year||yr,label:x.label||meta.label||"",genre:x.genre||meta.genre||""}));
    setAlbumSugs([]);
  }

  const [sbUrl, setSbUrl] = useState(localStorage.getItem("sb_url")||"");
  const [sbKey, setSbKey] = useState(localStorage.getItem("sb_key")||"");
  const [sbStatus, setSbStatus] = useState("");
  async function connectSb() {
    setSbStatus("Testing…");
    try {
      const r = await fetch(sbUrl+"/rest/v1/collection?select=id&limit=1",{headers:{"apikey":sbKey,"Authorization":"Bearer "+sbKey}});
      if (r.ok||r.status===406) {
        localStorage.setItem("sb_url",sbUrl.trim());
        localStorage.setItem("sb_key",sbKey.trim());
        setSbStatus("✓ Connected! Reload to sync.");
      } else { setSbStatus("Failed — check URL and key"); }
    } catch(e) { setSbStatus("Error: "+e.message); }
  }

  const genres=[...new Set(col.map(r=>r.genre).filter(Boolean))].sort();

  return (
    <div style={S.wrap}>
      {/* Header */}
      <div style={S.header}>
        <div style={S.title}>VinylBrain</div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>
          <div style={{fontSize:11,color:"#6b6559"}}>{col.length} records</div>
          <div style={{fontSize:9,color:getSBUrl()?"#4a8c5c":"#6b6559"}}>
            {getSBUrl() ? "● cloud" : "○ local only"}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={S.content}>

        {/* COLLECTION */}
        {tab==="collection" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{color:"#6b6559",fontSize:11}}>{col.length} records</div>
              <button style={S.btnPri} onClick={()=>setModal("add")}>+ Add Record</button>
            </div>
            {col.length===0
              ? <div style={{...S.card,color:"#6b6559",textAlign:"center"}}>No records yet. Tap + Add Record to start.</div>
              : col.map(r=>(
                <div key={r.id} style={S.card}>
                  <div style={{fontWeight:700,marginBottom:2}}>{r.artist}</div>
                  <div style={{fontStyle:"italic",color:"#6b6559",fontSize:12,marginBottom:4}}>{r.album}</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",fontSize:10,color:"#6b6559"}}>
                    {r.year&&<span>{r.year}</span>}
                    {r.genre&&<span style={{color:"#c8a96e"}}>{r.genre}</span>}
                    {r.format&&r.format!=="LP"&&<span>{r.format}</span>}
                    {r.pressingType&&<span>{r.pressingType}</span>}
                  </div>
                  <button style={{...S.btn,marginTop:8,fontSize:10,padding:"4px 10px",color:"#b84040",borderColor:"#3a1a1a"}} onClick={()=>removeRecord(r.id)}>Remove</button>
                </div>
              ))
            }
          </div>
        )}

        {/* WATCHLIST */}
        {tab==="watchlist" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{color:"#6b6559",fontSize:11}}>{wish.length} items</div>
              <button style={S.btnPri} onClick={()=>setModal("add-wish")}>+ Add</button>
            </div>
            {wish.length===0
              ? <div style={{...S.card,color:"#6b6559",textAlign:"center"}}>Nothing on your watchlist yet.</div>
              : wish.map(w=>(
                <div key={w.id} style={S.card}>
                  <div style={{fontWeight:700,marginBottom:2}}>{w.artist}</div>
                  <div style={{fontStyle:"italic",color:"#6b6559",fontSize:12,marginBottom:4}}>{w.album}</div>
                  {w.notes&&<div style={{fontSize:11,color:"#6b6559",marginBottom:4}}>{w.notes}</div>}
                  {w.alertUnder&&<div style={{fontSize:10,color:"#e0a030",marginBottom:4}}>🔔 Alert under ${w.alertUnder}</div>}
                  <div style={{display:"flex",gap:6}}>
                    <span style={{fontSize:10,padding:"2px 7px",border:"1px solid",borderRadius:2,borderColor:w.priority==="high"?"#6a2020":"#2a5030",color:w.priority==="high"?"#c04040":"#4a8c5c"}}>{w.priority||"medium"}</span>
                  </div>
                </div>
              ))
            }
          </div>
        )}

        {/* GAP ANALYSIS */}
        {tab==="gaps" && (
          <div>
            <div style={{...S.card,marginBottom:14}}>
              <div style={{fontFamily:"'DM Serif Display',serif",color:"#d4a853",fontSize:16,marginBottom:8,fontStyle:"italic"}}>Your Artists</div>
              {[...new Set(col.map(r=>r.artist).filter(Boolean))].filter(a=>DISCOGRAPHIES[a]).map(artist=>{
                const owned=col.filter(r=>r.artist===artist).map(r=>r.album);
                const all=DISCOGRAPHIES[artist];
                const pct=Math.round(owned.length/all.length*100);
                return (
                  <div key={artist} style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <div style={{fontWeight:700,fontSize:12}}>{artist}</div>
                      <div style={{color:"#6b6559",fontSize:11}}>{owned.length}/{all.length}</div>
                    </div>
                    <div style={{height:4,background:"#222",borderRadius:2,marginBottom:8}}>
                      <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,#7c5c2e,#d4a853)",borderRadius:2}}/>
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {all.map(album=>{
                        const own=owned.some(o=>o.toLowerCase().includes(album.toLowerCase().slice(0,10)));
                        return (
                          <div key={album} style={{fontSize:10,padding:"3px 8px",border:"1px solid",borderRadius:3,
                            borderColor:own?"#2a4a30":"#2e2a25",color:own?"#4a8c5c":"#6b6559",cursor:own?"default":"pointer"}}
                            onClick={()=>{
                              if(own) return;
                              const meta=ALBUM_META[artist]?.[album]||{};
                              const yr=ALBUM_YEARS[artist]?.[album]||"";
                              setCol(prev=>[...prev,{id:Date.now(),artist,album,year:meta.year||yr,label:meta.label||"",genre:meta.genre||"",format:"LP",pressingType:"",pressing:"",notes:"",added:new Date().toISOString()}]);
                              showToast("Added "+album);
                            }}>
                            {album}{own?" ✓":" +"}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              {col.length===0&&<div style={{color:"#6b6559",fontSize:12}}>Add some records first to see gap analysis.</div>}
            </div>
          </div>
        )}

        {/* CRATE (CHAT) */}
        {tab==="chat" && (
          <MobileChat col={col} wish={wish}/>
        )}

        {/* SETTINGS */}
        {tab==="settings" && (
          <div>
            <div style={S.card}>
              <div style={{fontFamily:"'DM Serif Display',serif",color:"#d4a853",fontSize:16,marginBottom:10,fontStyle:"italic"}}>Cloud Sync</div>
              <div style={{fontSize:11,marginBottom:12,lineHeight:1.6,color:getSBUrl()?"#4a8c5c":"#6b6559"}}>
                {getSBUrl() ? "✓ Supabase connected" : "Not connected — enter details below."}
              </div>
              {getSBUrl() && (
                <div style={{marginBottom:12}}>
                  <button style={S.btnPri} onClick={async()=>{
                    setSbStatus("Fetching from Supabase…");
                    const rows = await sbFetch("collection?select=data&order=id");
                    if (Array.isArray(rows) && rows.length > 0) {
                      const data = rows[0].data || [];
                      setCol(data);
                      localStorage.setItem(K.COL, JSON.stringify(data));
                      setSbStatus("✓ Loaded "+data.length+" records from cloud");
                    } else {
                      setSbStatus("Cloud returned: "+JSON.stringify(rows)+" — pushing local data up…");
                      await sset(K.COL, col);
                      setSbStatus("✓ Pushed "+col.length+" local records to cloud");
                    }
                  }}>Force Sync Now</button>
                </div>
              )}
              <label style={S.label}>Supabase Project URL</label>
              <input style={S.input} placeholder="https://xxxx.supabase.co" value={sbUrl} onChange={e=>setSbUrl(e.target.value)}/>
              <label style={S.label}>Supabase Anon Key</label>
              <input style={S.input} placeholder="eyJ..." value={sbKey} onChange={e=>setSbKey(e.target.value)}/>
              {sbStatus&&<div style={{fontSize:11,color:sbStatus.startsWith("✓")?"#4a8c5c":"#e0a030",marginBottom:10,lineHeight:1.5}}>{sbStatus}</div>}
              <button style={S.btnPri} onClick={connectSb}>Connect & Sync</button>
            </div>
          </div>
        )}

      </div>

      {/* Bottom Nav */}
      <div style={S.bottomNav}>
        {TABS.map(t=>(
          <button key={t.id} style={tab===t.id?S.navBtnOn:S.navBtn} onClick={()=>setTab(t.id)}>
            <span style={{fontSize:18,lineHeight:1}}>{t.icon}</span>
            {t.label}
          </button>
        ))}
      </div>

      {/* Add Record Modal */}
      {modal==="add" && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"#151310",borderRadius:"12px 12px 0 0",padding:"20px 16px",width:"100%",maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{fontFamily:"'DM Serif Display',serif",color:"#d4a853",fontSize:18,marginBottom:16}}>Add Record</div>
            <label style={S.label}>Artist *</label>
            <input style={S.input} placeholder="Start typing…" value={f.artist} onChange={e=>onArtistChange(e.target.value)}/>
            {artistSugs.length>0&&(
              <div style={{background:"#1c1917",border:"1px solid #2e2a25",borderRadius:3,marginTop:-10,marginBottom:10}}>
                {artistSugs.map(a=><div key={a} style={{padding:"10px 12px",borderBottom:"1px solid #2e2a25",color:"#ede8df",fontSize:12}} onClick={()=>pickArtist(a)}>{a}</div>)}
              </div>
            )}
            <label style={S.label}>Album *</label>
            <input style={S.input} placeholder={f.artist?"Start typing…":"Pick artist first"} value={f.album} disabled={!f.artist} onChange={e=>onAlbumChange(e.target.value)} onFocus={()=>{if(!f.album&&f.artist){const all=[...new Set([...(DISCOGRAPHIES[f.artist]||[]),...col.filter(r=>r.artist===f.artist).map(r=>r.album)])];setAlbumSugs(all.slice(0,8));}}}/>
            {albumSugs.length>0&&(
              <div style={{background:"#1c1917",border:"1px solid #2e2a25",borderRadius:3,marginTop:-10,marginBottom:10}}>
                {albumSugs.map(a=><div key={a} style={{padding:"10px 12px",borderBottom:"1px solid #2e2a25",color:"#ede8df",fontSize:12}} onClick={()=>pickAlbum(a)}>{a}</div>)}
              </div>
            )}
            <label style={S.label}>Year</label>
            <input style={S.input} placeholder="auto-filled" value={f.year} onChange={e=>setF(x=>({...x,year:e.target.value}))}/>
            <label style={S.label}>Genre</label>
            <input style={S.input} placeholder="e.g. Rock" value={f.genre} onChange={e=>setF(x=>({...x,genre:e.target.value}))}/>
            <label style={S.label}>Label</label>
            <input style={S.input} placeholder="e.g. Columbia" value={f.label} onChange={e=>setF(x=>({...x,label:e.target.value}))}/>
            <label style={S.label}>Format</label>
            <select style={S.select} value={f.format} onChange={e=>setF(x=>({...x,format:e.target.value}))}>
              {["LP","2xLP","3xLP","EP","12\" Single","10\" Single","7\" Single","Box Set","Picture Disc","Colored Vinyl"].map(v=><option key={v}>{v}</option>)}
            </select>
            <label style={S.label}>Pressing Type</label>
            <select style={S.select} value={f.pressingType} onChange={e=>setF(x=>({...x,pressingType:e.target.value}))}>
              <option value="">— select —</option>
              {["Original","Original US","Original UK","Original EU","Original JP","Reissue","Reissue US","Reissue UK","180g Reissue","Anniversary Edition","Limited Edition","Promo","Test Pressing"].map(v=><option key={v}>{v}</option>)}
            </select>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={S.btn} onClick={()=>{setModal(null);setArtistSugs([]);setAlbumSugs([]);}}>Cancel</button>
              <button style={S.btnPri} onClick={()=>{if(!f.artist.trim()||!f.album.trim()){alert("Artist + Album required");return;}addRecord(f);setF({artist:"",album:"",year:"",genre:"",label:"",format:"LP",pressingType:"",pressing:"",notes:""});}}>Add Record</button>
            </div>
          </div>
        </div>
      )}

      {/* Add Wish Modal */}
      {modal==="add-wish" && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"#151310",borderRadius:"12px 12px 0 0",padding:"20px 16px",width:"100%",maxHeight:"75vh",overflowY:"auto"}}>
            <div style={{fontFamily:"'DM Serif Display',serif",color:"#d4a853",fontSize:18,marginBottom:16}}>Add to Watchlist</div>
            {["artist","album","notes"].map(k=>(
              <div key={k}>
                <label style={S.label}>{k.charAt(0).toUpperCase()+k.slice(1)}{k==="artist"||k==="album"?" *":""}</label>
                <input style={S.input} value={wish[k]||""} onChange={e=>setModal(m=>({...m,[k]:e.target.value}))}
                  placeholder={k==="notes"?"e.g. US press only":""}/>
              </div>
            ))}
            <label style={S.label}>Alert Under ($)</label>
            <input style={S.input} placeholder="e.g. 75" type="number"/>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={S.btn} onClick={()=>setModal(null)}>Cancel</button>
              <button style={S.btnPri} onClick={()=>{
                const el = document.querySelectorAll('#root input');
                // Simple: just close and use state
                setModal(null);
              }}>Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Auth Modal */}
      {mAuthModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#151310",borderRadius:8,padding:"24px 20px",width:"100%",maxWidth:340}}>
            <div style={{fontFamily:"'DM Serif Display',serif",color:"#d4a853",fontSize:18,marginBottom:8}}>Password Required</div>
            <div style={{color:"#6b6559",fontSize:12,marginBottom:16}}>This collection is password protected.</div>
            <input type="password" placeholder="Password" value={mAuthInput} autoFocus
              style={{background:"#1c1917",border:"1px solid #2e2a25",borderRadius:3,color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:14,padding:"12px",width:"100%",marginBottom:8,outline:"none",boxSizing:"border-box"}}
              onChange={e=>setMAuthInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&mSubmitAuth()}/>
            {mAuthError&&<div style={{color:"#b84040",fontSize:11,marginBottom:8}}>{mAuthError}</div>}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{flex:1,background:"none",border:"1px solid #2e2a25",borderRadius:3,color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:12,padding:"10px",cursor:"pointer"}} onClick={()=>setMAuthModal(false)}>Cancel</button>
              <button style={{flex:1,background:"#8b6914",border:"none",borderRadius:3,color:"#f5e8c8",fontFamily:"'DM Mono',monospace",fontSize:12,padding:"10px",cursor:"pointer"}} onClick={mSubmitAuth}>Unlock</button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      <div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:"#1c1917",border:"1px solid #8b6914",borderRadius:4,color:"#d4a853",fontSize:11,padding:"8px 14px",opacity:toast.on?1:0,transition:"opacity .25s",pointerEvents:"none",whiteSpace:"nowrap",zIndex:200}}>
        {toast.msg}
      </div>
    </div>
  );
}

function MobileChat({col, wish}) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const [thinking, setThinking] = useState(false);
  const endRef = useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs,thinking]);

  async function send() {
    if (!input.trim()) return;
    const userMsg = {role:"user",content:input.trim()};
    const newMsgs = [...msgs, userMsg];
    setMsgs(newMsgs); setInput(""); setThinking(true);
    const colSum = col.slice(0,30).map(r=>`${r.artist} — ${r.album}`).join(", ");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,
          system:`You are a vinyl record advisor. The user's collection: ${colSum||"(empty)"}. Be helpful, concise, conversational.`,
          messages:newMsgs})
      });
      const d = await res.json();
      const reply = d.content?.[0]?.text || "Sorry, try again.";
      setMsgs(prev=>[...prev,{role:"assistant",content:reply}]);
    } catch { setMsgs(prev=>[...prev,{role:"assistant",content:"Connection error."}]); }
    setThinking(false);
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{flex:1,overflowY:"auto",paddingBottom:8}}>
        {msgs.length===0&&<div style={{color:"#6b6559",fontSize:12,textAlign:"center",paddingTop:20}}>Ask me anything about your collection, what to hunt for, pressing details…</div>}
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:10}}>
            <div style={{maxWidth:"85%",padding:"10px 13px",borderRadius:m.role==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px",
              background:m.role==="user"?"#8b6914":"#1c1917",border:"1px solid",borderColor:m.role==="user"?"#c8a96e":"#2e2a25",
              fontSize:12,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
              {m.content}
            </div>
          </div>
        ))}
        {thinking&&<div style={{color:"#6b6559",fontSize:12,padding:"8px 0"}}>thinking…</div>}
        <div ref={endRef}/>
      </div>
      <div style={{display:"flex",gap:8,paddingTop:10,borderTop:"1px solid #2e2a25"}}>
        <input style={{flex:1,background:"#1c1917",border:"1px solid #2e2a25",borderRadius:3,color:"#ede8df",fontFamily:"'DM Mono',monospace",fontSize:13,padding:"10px 12px",outline:"none"}}
          placeholder="Ask the Crate…" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button style={{background:"#8b6914",border:"none",borderRadius:3,color:"#f5e8c8",padding:"10px 14px",cursor:"pointer",fontSize:12}} onClick={send}>Send</button>
      </div>
    </div>
  );
}

// ── Entry point: desktop gets full app, mobile gets mobile app ────────────────
function AppEntry() {
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);
  return isMobile ? React.createElement(MobileApp) : React.createElement(VinylBrain);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AppEntry));
